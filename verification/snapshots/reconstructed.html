      handoutIntro:'A reminder to discuss with your PD team. Your individual instructions come first.',handoutHeads:['Before your visit','During placement','Healing and starting dialysis','Looking after the catheter','Call your PD team immediately'],placementSummary:'The area is numbed. A needle and guidewire help place a soft tube into your belly. A short tunnel and cuffs help keep it in place. You may be awake or drowsy; tell the team about pain.',checklistIntro:'For routine care after healing, once your PD nurse has trained you. For a newly placed catheter, follow the early dressing instructions below.',checklistItems:['Wash and dry your hands before care.','Look at the exit site and nearby skin each day.','Follow the cleaning schedule and use only the products your team recommends.','Use any prescribed ointment exactly as taught.','Keep the tube secured so it cannot tug; avoid tight clothing rubbing the site.','Know your PD team’s daytime and after-hours numbers.'],earlyCare:'While the site is healing',caregiverIntro:'You do not need to do everything. Agree with your loved one and the PD nurse on how you can help.',caregiverItems:['Ask what help feels useful; listen and write down questions.','Wash and dry your hands before helping with care.','Help look at the exit site without pulling the tube or disturbing a new dressing.','Only carry out care or exchanges after the PD team has trained you.','Keep supplies ready and support the team’s care plan.','Call the PD team immediately for the warning signs below.'],noteEmergency:'If you cannot reach the PD team promptly, seek urgent medical care. For severe illness, use your local emergency service.',
      phases:[
        {name:'Meet your catheter',sub:'A small tube with a big purpose',category:'Getting familiar',title:'Meet your PD catheter',description:'Peritoneal dialysis (PD) uses the lining inside your belly — the peritoneum — to help clean your blood. A soft tube called a catheter lets dialysis fluid flow in and out. With CAPD (continuous ambulatory peritoneal dialysis), you change this fluid by hand after training.',visual:'anatomy',statuses:[['heart','A new routine, gently','It’s natural to have questions. You can learn a little at a time.'],['leaf','Designed to stay with you','A short part of the tube stays outside your body and can be secured under clothing.'],['people','You’ll have support','Your PD nurse will teach you how to use and care for your catheter.']],caregiver:'Sit together and ask what feels unclear. You can pause at any step and write down questions for the PD nurse.',question:'What is the catheter there to do?',answers:['Let dialysis fluid move in and out of my belly','Go into my stomach to carry food'],correct:0,yes:'That’s right. It carries dialysis fluid into and out of the belly space, not the stomach.',no:'A helpful distinction: the tube sits in the belly space, not in the stomach. It carries dialysis fluid.'},
        {name:'Before your procedure',sub:'Getting ready, together',category:'Preparing',title:'A little preparation helps',description:'Your team checks your health and helps choose the best place for the tube to come out. They may mark this spot while you sit or stand, away from your belt and skin folds. Bring your questions and your medicine list.',visual:'prepare',points:['fastingInstructions','medicationInstructions','bowelInstructions','arrivalInstructions'],statuses:[['clipboard','Your own preparation plan','Fasting and medicine instructions depend on your health and your center.'],['message','Tell your team','Mention allergies, blood-thinning medicines, and any past belly operations.'],['people','Plan some company','Ask who may come with you and arrange your trip home.']],caregiver:'Help gather the medicine list, written instructions, and questions. Confirm the transport plan with the clinic.',question:'What should I do about fasting and medicines?',answers:['Use the same instructions as a friend','Follow the instructions from my own care team'],correct:1,yes:'Exactly. Your team will give you a plan that fits your health and medicines.',no:'Instructions can differ. Check your own team’s plan before changing food, drink, or medicines.'},
        {name:'Keeping you comfortable',sub:'Numbing & relaxation',category:'Your comfort',title:'Your comfort matters',description:'Local anesthetic numbs a small area; you may feel a brief sting. You may also be offered light sedation to help you relax. You will usually be awake or drowsy and may feel pressure or tugging. Tell the team if you feel pain.',visual:'comfort',note:['You can speak up.','Let the team know if you feel uncomfortable, worried, or need something explained again.'],statuses:[['heart','What you may feel','A brief sting, then pressure or tugging. Speak up about any pain.'],['leaf','Awake or lightly drowsy','Sedation is optional and depends on your needs and your team’s plan.'],['people','Someone is looking after you','Your care team checks how you are feeling throughout the procedure.']],caregiver:'Tell the team about your loved one’s worries, hearing needs, or preferred language before the procedure.',question:'If I feel pain, what should I do?',answers:['Tell the team right away','Stay quiet and wait for it to finish'],correct:0,yes:'Yes. Tell the team so they can check and help with your comfort.',no:'You do not have to stay quiet. Let the team know about pain or discomfort right away.'},
        {name:'Placing the catheter',sub:'Follow the gentle route',category:'The procedure',title:'A small path into your belly',description:'In a bedside or procedure-room setting, a needle and guidewire help place the soft tube, then a short tunnel under the skin leads to the exit site. This percutaneous method usually uses local numbing rather than general anesthesia and avoids a large incision. Your team will explain your recovery plan.',visual:'placement',statuses:[['leaf','A small opening','The tube is guided into the belly space. Instruments are not shown in this guide.'],['clock','One step at a time','Ask your team how long your procedure and observation are likely to take.'],['shield','A check before you leave','The team tests fluid flow to check how the catheter is working.']],caregiver:'The picture is a simplified map, not instructions for carrying out the procedure. Ask the team to explain anything that is unclear.',question:'Where does the inside end of the tube rest?',answers:['In the space inside my belly, low in the pelvis','In my stomach'],correct:0,yes:'That’s right. The tip rests low in the belly space, in the pelvis.',no:'It does not go into your stomach. The tip rests low in the belly space, in the pelvis.'},
        {name:'Right after placement',sub:'Rest, check & recover',category:'Early recovery',title:'Time to rest and check in',description:'Your team watches you after placement and checks the catheter’s fluid flow. Mild soreness can happen; tell the team about pain that is strong or getting worse. You may go home the same day if your team says you are ready.',visual:'recovery',points:['dischargeInstructions','dressingInstructions'],statuses:[['heart','A little soreness is possible','Tell the team if pain is strong, gets worse, or worries you.'],['clipboard','Before heading home','Make sure you know your dressing plan, follow-up date, and who to call.'],['people','A supported trip home','If you had sedation, follow the team’s travel and supervision instructions.']],caregiver:'Listen to the discharge instructions together. Help with the journey home, and know who to call if there is a problem.',question:'What should I know before leaving?',answers:['Only the date of my next visit','My care plan, follow-up date, and who to call'],correct:1,yes:'Yes. Ask for written instructions and a number for help, including after hours.',no:'The date matters, and so do your care plan and contact numbers. Ask for all three.'},
        {name:'Giving your body time',sub:'The break-in period',category:'Healing',title:'Let your catheter settle in',description:'The break-in period gives the area around the tube time to heal and helps reduce leaks. For a planned start, ISPD recommends at least 2 weeks when possible. An earlier start needs a special plan from your PD team.',visual:'healing',points:['dialysisStartInstructions','dressingInstructions','activityInstructions'],statuses:[['clock','At least 2 weeks, when possible','Your team chooses the start date. Healing and readiness vary.'],['shield','Protect the dressing','Keep it dry. Ask your team for help if it is wet, dirty, loose, or blood-soaked.'],['leaf','Be gentle with yourself','Avoid straining and heavy lifting. Follow your constipation prevention plan.']],caregiver:'Help with chores that involve lifting. Keep the follow-up plan handy and leave early dressing changes to the PD team.',question:'When should I begin dialysis exchanges?',answers:['As soon as I feel ready','Only when my PD team tells me to'],correct:1,yes:'Exactly. Your team chooses the safe start date and teaches you the plan.',no:'Feeling ready does not mean the site has healed. Start only with your team’s instructions.'},
        {name:'Living with your catheter',sub:'Small habits, daily care',category:'Life at home',title:'Build a gentle care routine',description:'Once the site has healed, your PD nurse will teach you how to look after it. Check the skin where the tube comes out each day. Keep the catheter secure and choose clothes that do not rub or pull on it.',visual:'living',points:['dailyCareInstructions','bathingInstructions','activityInstructions'],statuses:[['clipboard','Learn, then practice','Ask your nurse to watch you do the care routine and help you feel confident.'],['droplet','Water needs a plan','Showering, bathing, and swimming have different risks. Get advice for each.'],['leaf','Make room for daily life','Talk about your usual work, hobbies, and exercise so the plan fits you.']],caregiver:'With permission, help look at the site. Wash your hands first and only carry out tasks the PD team has taught you.',question:'When is it okay to start showering?',answers:['When my PD team says the site is ready','As soon as I get home'],correct:0,yes:'That’s right. Your team will explain when and how to shower safely.',no:'A new site needs to stay dry. Ask your team when it is ready and how to protect it.'},
        {name:'When to call your team',sub:'Know the warning signs',category:'Getting help',title:'Notice a change? Make the call.',description:'You know your body. If you notice any of these changes, call your PD team immediately, even if you are unsure. Getting help early lets the team assess what is happening.',visual:'warnings',statuses:[['phone','Call right away','Do not wait for your next visit or wait to see if symptoms settle.'],['message','Say what has changed','Tell the team about pain, fever, the exit site, and any change in drained fluid.'],['shield','If you cannot reach them','Seek urgent medical care. Use your local emergency service for severe illness.']],caregiver:'Help make the call and explain what has changed. Cloudy drained fluid needs an immediate call even when your loved one feels well.',question:'The drained fluid looks cloudy, but I feel fine. What now?',answers:['Wait until tomorrow to see if it clears','Call my PD team immediately'],correct:1,yes:'Yes. Cloudy fluid can be a sign of infection even without pain. Call immediately.',no:'Please do not wait. Cloudy fluid needs an immediate call even if you feel well.'}
      ]
    },

      </ul>

  // Dependency-free, one-page A4 PDF. English/Latin handout uses standard PDF fonts.
  // For Devanagari translations, use the print route (browser font shaping) or embed
  // a suitable Unicode font and PDF shaping implementation before enabling download.
  function downloadSummary(){
    const latin=s=>String(s).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/[^\x20-\x7e]/g,'?');
    // Preserve non-Latin clinic instructions via the browser's native PDF export.
    const custom=Object.values(CLINIC_CONFIG).join('');if(/[^\u0000-\u024f\u2000-\u206f]/.test(custom)||state.language!=='en'){window.print();return;}
    const wrap=(value,limit)=>{const words=latin(value).split(/\s+/),lines=[];let line='';for(const word of words){if((line+' '+word).trim().length>limit&&line){lines.push(line);line=word;}else line=(line+' '+word).trim();}if(line)lines.push(line);return lines;};
    const heads=t('handoutHeads');const sections=[
      [heads[0],CLINIC_CONFIG.fastingInstructions+' '+CLINIC_CONFIG.medicationInstructions],
      [heads[1],t('placementSummary')],
      [heads[2],CLINIC_CONFIG.dialysisStartInstructions+' '+CLINIC_CONFIG.dressingInstructions],
      [heads[3],CLINIC_CONFIG.dailyCareInstructions+' '+CLINIC_CONFIG.activityInstructions+' '+CLINIC_CONFIG.bathingInstructions],
      [heads[4],t('warningItems').join('; ')+'. '+t('noteEmergency')],
      [CLINIC_CONFIG.centerName,t('daytime')+': '+(CLINIC_CONFIG.phone||t('contactMissing'))+'  '+t('afterHours')+': '+(CLINIC_CONFIG.afterHoursPhone||t('contactMissing'))]
    ];
    let font=10,leading=14,limit=93;
    const height=()=>sections.reduce((n,[h,b])=>n+25+wrap(b,limit).length*leading,0)+wrap(t('disclaimer'),limit).length*leading+100;
    while(height()>735&&font>8){font-=.5;leading-=.6;limit+=5;}
    // Extremely long local instructions should flow over pages, not be truncated.
    if(height()>735){window.print();return;}
    const pdfEscape=s=>latin(s).replace(/([\\()])/g,'\\$1');let stream='',y=790;
    const line=(s,size,bold=false,color='0.14 0.24 0.20')=>{stream+=`BT /${bold?'F2':'F1'} ${size} Tf ${color} rg 1 0 0 1 45 ${y.toFixed(1)} Tm (${pdfEscape(s)}) Tj ET\n`;};
    line('PD companion',11,true,'0.13 0.43 0.35');y-=29;line(t('summaryTitle'),20,true);y-=22;line(t('handoutIntro'),9);y-=25;
    for(const [heading,body]of sections){line(heading,11,true);y-=17;for(const row of wrap(body,limit)){line(row,font);y-=leading;}y-=10;}
    y-=3;for(const row of wrap(t('disclaimer'),limit)){line(row,8);y-=11;}y-=5;line('Sources: ISPD PD access (2019), catheter infections (2023), peritonitis (2022).',8);
    const objects=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>',`<< /Length ${stream.length} >>\nstream\n${stream}endstream`];
    let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((obj,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;});const xref=pdf.length;pdf+=`xref\n0 7\n0000000000 65535 f \n${offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size 7 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const url=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download='PD-companion-your-journey.pdf';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t('pdfSaved'));
  }
  function downloadConsentRecord(){
    const latin=s=>String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/[^\x20-\x7e]/g,'?');
    const wrap=(value,limit)=>{const words=latin(value).split(/\s+/),lines=[];let line='';for(const word of words){if((line+' '+word).trim().length>limit&&line){lines.push(line);line=word;}else line=(line+' '+word).trim();}if(line)lines.push(line);return lines;};
    const pdfEscape=s=>latin(s).replace(/([\\()])/g,'\\$1');
    let stream='', y=795;
    const line=(s,size,bold=false,color='0.14 0.24 0.20')=>{stream+=`BT /${bold?'F2':'F1'} ${size} Tf ${color} rg 1 0 0 1 45 ${y.toFixed(1)} Tm (${pdfEscape(s)}) Tj ET\n`;};

    line('PERITONEAL DIALYSIS CATHETER PLACEMENT - INFORMED DISCUSSION RECORD', 10.5, true, '0.13 0.43 0.35'); y-=16;
    line('Shared Decision-Making, Procedural Disclosure & Comprehension Record (ISPD Reference)', 8.5, false, '0.35 0.45 0.40'); y-=20;

    const pt=state.consentPatient;
    const ptName = pt.name || 'Not specified (Sign on paper)';
    const ptAge = pt.age || 'N/A';
    const ptMrn = pt.mrn || 'N/A';
    const ptDoc = pt.clinician || CLINIC_CONFIG.reviewedBy || 'Attending Nephrologist';
    const ptDate = pt.date || new Date().toISOString().split('T')[0];

    line(`Patient Name: ${ptName}    Age/Sex: ${ptAge}    MRN / Hospital ID: ${ptMrn}`, 8.5, true); y-=13;
    line(`Attending Clinician: ${ptDoc}    Discussion Date: ${ptDate}    Center: ${CLINIC_CONFIG.centerName}`, 8, false); y-=16;

    stream += `0.5 w 0.7 0.8 0.75 RG 45 ${y.toFixed(1)} m 550 ${y.toFixed(1)} l S\n`; y-=15;

    line('1. VERIFIED CLINICAL DISCLOSURE MODULES COMPLETED', 9, true, '0.15 0.35 0.28'); y-=13;
    const modules = [
      '[X] Module 1 - Overview & Purpose: Peritoneal cavity access for continuous ambulatory (CAPD) or automated (APD) dialysis.',
      '[X] Module 2 - Placement Technique: Percutaneous modified Seldinger route, 1% lidocaine numbing, saline fluid cushion.',
      '[X] Module 3 - Benefits & Alternatives: In-center hemodialysis (fistula/graft/line), transplant evaluation, conservative care.',
      '[X] Module 4 - Material Risks: Bleeding, organ injury (<0.5%), exit-site infection, peritonitis, dialysate leaks.',
      `[X] Module 5 - Comprehension Quiz: Patient completed 4-question check (${Object.keys(state.consentQuiz).length}/4 answered).`
    ];
    for(const m of modules){ line(m, 7.5); y-=11; }
    y-=4;

    stream += `0.5 w 0.7 0.8 0.75 RG 45 ${y.toFixed(1)} m 550 ${y.toFixed(1)} l S\n`; y-=15;

    line('2. PATIENT INFORMED UNDERSTANDING DECLARATIONS', 9, true, '0.15 0.35 0.28'); y-=13;
    const decls = CONSENT_SECTIONS[5].declarations;
    decls.forEach((d, idx)=>{
      const isChecked = state.consentDeclarations[idx] !== false;
      const prefix = isChecked ? '[X] ' : '[ ] ';
      const rows = wrap(prefix + d, 92);
      for(let r=0; r<rows.length; r++){
        line(rows[r], 7.5, r===0 && isChecked);
        y-=10.5;
      }
      y-=2;
    });
    y-=4;

    stream += `0.5 w 0.7 0.8 0.75 RG 45 ${y.toFixed(1)} m 550 ${y.toFixed(1)} l S\n`; y-=15;

    line('3. SHARED DECISION-MAKING & COUNSELING SIGNATURES', 9, true, '0.15 0.35 0.28'); y-=26;

    line('___________________________________           ___________________________________           ___________________________________', 7.5, false, '0.4 0.4 0.4'); y-=11;
    line('Patient / Representative Signature            Attending Nephrologist Signature              PD Access Nurse / Witness Signature', 7.5, true); y-=10;
    line(`Printed Name: ${ptName.slice(0,25)}           Doctor Name: ${ptDoc.slice(0,25)}             Nurse Name: _______________________`, 7, false, '0.3 0.3 0.3'); y-=10;
    line(`Date: ${ptDate}                               Date & Reg. No: ____________________          Date: ${ptDate}`, 7, false, '0.3 0.3 0.3'); y-=20;

    line('Statutory Notice: This document records patient participation in digital shared decision-making and informed disclosure.', 7, false, '0.4 0.4 0.4'); y-=9;
    line('Formal institutional legal consent is executed concurrently on official hospital documentation as mandated by healthcare regulations.', 7, false, '0.4 0.4 0.4'); y-=9;
    line('Generated by Peritoneal Dialysis Interactive Decision Companion · Zero personal health data stored or transmitted.', 6.5, false, '0.5 0.5 0.5');

    const objects=[
      '<< /Type /Catalog /Pages 2 0 R >>',
      '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>',
      `<< /Length ${stream.length} >>\nstream\n${stream}endstream`
    ];
    let pdf='%PDF-1.4\n',offsets=[0];
    objects.forEach((obj,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;});
    const xref=pdf.length;
    pdf+=`xref\n0 7\n0000000000 65535 f \n${offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size 7 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;

    const url=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));
    const a=document.createElement('a');
    a.href=url;
    a.download='PD-Catheter-Informed-Consent-Record.pdf';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast(t('consentRecordDownloaded'));
  }
  function resizeText(delta){state.scale=Math.min(1.375,Math.max(1,state.scale+delta));document.documentElement.style.setProperty('--scale',state.scale);$('font-down').disabled=state.scale<=1;$('font-up').disabled=state.scale>=1.375;toast(t('textSizeChanged',{n:Math.round(state.scale*100)}));}
  function closeModal(){$('modal').classList.remove('gallery-modal','consent-modal');$('modal').close();}
  document.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target)return;
    if(target.dataset.step!==undefined){go(Number(target.dataset.step));return;}
    if(target.dataset.answer!==undefined){state.answers[state.index]=Number(target.dataset.answer);renderQuiz();document.querySelector(`[data-answer="${target.dataset.answer}"]`).focus();return;}
    if(target.dataset.hotspot!==undefined){state.hotspot=Number(target.dataset.hotspot);renderVisual();document.querySelector(`[data-hotspot="${state.hotspot}"]`).focus();return;}
    if(target.dataset.sequence!==undefined){setSequence(Number(target.dataset.sequence));return;}
    if(target.id==='play-sequence'){toggleSequence();return;}
    if(target.id==='gallery-prev'){if(state.galleryIndex>0)renderClinicalGallery(state.galleryIndex-1);return;}
    if(target.id==='gallery-next'){if(state.galleryIndex<CLINICAL_STEPS.length-1)renderClinicalGallery(state.galleryIndex+1);return;}
    if(target.dataset.galleryStep!==undefined){renderClinicalGallery(Number(target.dataset.galleryStep));return;}
    if(target.dataset.consentStep!==undefined){state.consentStep=Number(target.dataset.consentStep);renderConsentCompanion(state.consentStep);return;}
    if(target.hasAttribute('data-consent-next')||target.closest('[data-consent-next]')){
      if(state.consentStep<CONSENT_SECTIONS.length-1){
        state.consentStep++;
        renderConsentCompanion(state.consentStep);
      }
      return;
    }
    if(target.hasAttribute('data-consent-review')||target.closest('[data-consent-review]')){$('modal').scrollTop=0;toast('Reviewing current section');return;}
    if(target.dataset.consentQuizQ!==undefined){
      const q=Number(target.dataset.consentQuizQ),opt=Number(target.dataset.consentQuizOpt);
      state.consentQuiz[q]=opt;
      renderConsentCompanion(state.consentStep);
      return;
    }
    const action=target.dataset.action;if(!action)return;
    if(action==='close')closeModal();
    else if(action==='print')window.print();
    else if(action==='download')downloadSummary();
    else if(action==='download-consent')downloadConsentRecord();
    else if(action==='consent-tool')openModal('consent-tool');
    else if(action==='confirm-reset'){state.completed.clear();state.answers={};closeModal();go(0);}
    else if(action==='confirm-gallery'){state.galleryConfirmed=true;renderClinicalGallery(state.galleryIndex||0);}
    else openModal(action);
  });
  document.addEventListener('change',event=>{
    const decl=event.target.dataset.consentDecl;
    if(decl!==undefined){state.consentDeclarations[Number(decl)]=event.target.checked;return;}
  });
  document.addEventListener('input',event=>{
    if(event.target.id==='consent-input-name')state.consentPatient.name=event.target.value;
    if(event.target.id==='consent-input-age')state.consentPatient.age=event.target.value;
    if(event.target.id==='consent-input-mrn')state.consentPatient.mrn=event.target.value;
    if(event.target.id==='consent-input-clinician')state.consentPatient.clinician=event.target.value;
    if(event.target.id==='consent-input-date')state.consentPatient.date=event.target.value;
  });
  $('back').addEventListener('click',()=>go(state.index-1));$('next').addEventListener('click',next);$('listen').addEventListener('click',speak);$('font-down').addEventListener('click',()=>resizeText(-.125));$('font-up').addEventListener('click',()=>resizeText(.125));$('font-down').disabled=true;
  $('caregiver-toggle').addEventListener('change',e=>{state.caregiver=e.target.checked;stopAudio();renderRight();});
  $('language').addEventListener('change',e=>{const lang=e.target.value;if(!TRANSLATIONS[lang]){e.target.value=state.language;toast(t('languageUnavailable'));return;}stopAudio();state.language=lang;document.documentElement.lang=lang;render();});
  $('close-modal').addEventListener('click',closeModal);
  $('modal').addEventListener('close',()=>$('modal').classList.remove('gallery-modal','consent-modal'));
  $('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
  document.addEventListener('keydown',e=>{
    if($('modal').open && $('modal').classList.contains('gallery-modal')){
      if(e.key==='ArrowLeft'&&state.galleryIndex>0)renderClinicalGallery(state.galleryIndex-1);
      else if(e.key==='ArrowRight'&&state.galleryIndex<CLINICAL_STEPS.length-1)renderClinicalGallery(state.galleryIndex+1);
    }
  });
  window.addEventListener('pagehide',()=>{stopAudio();stopSequence();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAudio();if(state.playing){stopSequence();renderVisual();}}});
  if('speechSynthesis' in window)window.speechSynthesis.getVoices();
  render();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d6c5e">
  <meta name="description"
    content="An anatomically illustrated patient and family guide to bedside percutaneous peritoneal dialysis catheter placement.">
  <title>PD Consent Buddy — Your catheter journey</title>
  <link rel="icon" type="image/webp" href="assets/logo.webp">
  <link rel="alternate icon" type="image/png" href="assets/logo.png">
  <style>
    :root {
      --ink: #1b332e;
      --muted: #5c716a;
      --soft: #7c8d86;
      --teal: #1d6c5e;
      --deep: #124a41;
      --mint: #e7f2ec;
      --line: #dde5dd;
      --rule: #c6d3c7;
      --paper: #fffdf8;
      --bg: #f4f6f0;
      --red: #9e3a33;
      --amber: #8a6a24;
      --scale: 1;
      font-size: calc(16px * var(--scale));
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0
    }

    button,
    select {
      font: inherit
    }

    button,
    a,
    select {
      -webkit-tap-highlight-color: transparent
    }

    button {
      cursor: pointer
    }

    button:disabled {
      cursor: default;
      opacity: .45
    }

    button,
    a,
    select,
    input {
      touch-action: manipulation
    }

    button:focus-visible,
    a:focus-visible,
    select:focus-visible,
    input:focus-visible,
    [tabindex="-1"]:focus-visible {
      outline: 3px solid #2b6ea8;
      outline-offset: 3px
    }

    button {
      color: inherit
    }

    a {
      color: var(--teal)
    }

    svg {
      display: block
    }

    button svg,
    a svg {
      flex-shrink: 0
    }

    .icon {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      stroke-width: 1.7;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0
    }

    [hidden] {
      display: none !important
    }

    .skip {
      position: fixed;
      left: 16px;
      top: -100px;
      z-index: 100;
      background: white;
      padding: 15px;
      border-radius: 8px
    }

    .skip:focus {
      top: 12px
    }

    .topbar {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 42px;
      background: var(--paper);
      border-bottom: 1px solid var(--line)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 9px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.14));
      flex-shrink: 0;
      transition: transform .2s ease;
    }

    .brand-logo:hover {
      transform: scale(1.05);
    }

    .brand-name {
      font-size: 1.32rem;
      font-weight: 750;
      letter-spacing: -.7px
    }

    .brand-name span {
      font-weight: 450
    }

    .brand-sub {
      font-size: .67rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 3px
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 22px
    }

    .font-controls {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .font-controls button {
      background: none;
      border: 1px solid transparent;
      min-width: 40px;
      height: 42px;
      border-radius: 8px;
      font-weight: 600
    }

    .font-controls button:hover {
      background: var(--mint)
    }

    .font-label {
      font-size: .72rem;
      color: var(--muted)
    }

    .language {
      display: flex;
      gap: 8px;
      align-items: center;
      border-left: 1px solid var(--line);
      padding-left: 21px
    }

    .language select {
      border: 0;
      background: transparent;
      font-size: .85rem;
      color: var(--ink);
      padding: 10px 4px;
      max-width: 120px
    }

    .team-btn,
    .outline-btn {
      border: 1px solid #bed3c5;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 11px 16px;
      border-radius: 9px;
      font-size: .85rem;
      font-weight: 600;
      min-height: 44px
    }

    .team-btn:hover,
    .outline-btn:hover {
      background: var(--mint)
    }

    .shell {
      max-width: 1560px;
      margin: auto;
      padding: 32px 42px 22px
    }

    .welcome {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 27px
    }

    .eyebrow {
      font-size: .69rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--teal);
      display: flex;
      align-items: center;
      gap: 7px
    }

    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #5f9273;
      border-radius: 50%
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 2.45rem;
      letter-spacing: -1.1px;
      line-height: 1.15;
      margin: 10px 0 9px
    }

    .welcome p {
      color: var(--muted);
      font-size: .91rem;
      margin: 0;
      line-height: 1.6;
      max-width: 62ch
    }

    .pace {
      font-size: .76rem;
      color: var(--muted);
      display: flex;
      gap: 7px;
      align-items: center;
      white-space: nowrap;
      padding-bottom: 6px
    }

    .pace .icon {
      width: 17px;
      height: 17px
    }

    .layout {
      display: grid;
      grid-template-columns: 235px minmax(0, 1fr) 262px;
      align-items: start;
      gap: 26px
    }

    .journey {
      padding: 22px 0 0
    }

    .section-heading {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      font-weight: 750;
      margin: 0
    }

    .journey-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-right: 12px
    }

    .step-total {
      font-size: .69rem;
      background: #e6ece2;
      padding: 5px 9px;
      border-radius: 20px;
      color: #50634d
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .73rem;
      margin: 20px 12px 9px 0
    }

    .progress {
      height: 5px;
      background: #dce5d9;
      border-radius: 9px;
      margin-right: 12px;
      overflow: hidden
    }

    .progress-fill {
      height: 100%;
      background: var(--teal);
      transition: width .3s
    }

    .steps {
      list-style: none;
      margin: 25px 0 20px;
      padding: 0
    }

    .steps li {
      position: relative;
      margin: 0 0 5px
    }

    .steps li:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 25px;
      top: 49px;
      width: 1px;
      height: 15px;
      background: #d2dcd1
    }

    .step {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 11px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      min-height: 60px
    }

    .step:hover {
      background: #ebefe6
    }

    .step.active {
      background: #e2eee3;
      border-color: #c7d9c6
    }

    .step-number {
      width: 30px;
      height: 30px;
      border: 1px solid #c2d0c2;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: .76rem;
      background: var(--bg);
      flex-shrink: 0;
      color: var(--muted)
    }

    .active .step-number {
      background: var(--teal);
      border-color: var(--teal);
      color: white
    }

    .done .step-number {
      background: #d9eadc;
      color: var(--teal);
      border-color: #bad0bb
    }

    .step-name {
      font-size: .81rem;
      line-height: 1.35;
      font-weight: 550
    }

    .step-sub {
      display: block;
      font-size: .67rem;
      font-weight: 400;
      color: var(--muted);
      margin-top: 3px
    }

    .active .step-name {
      font-weight: 700;
      color: var(--deep)
    }

    .step-number .icon {
      width: 16px;
      height: 16px
    }

    .caregiver-toggle {
      margin: 27px 10px 0 0;
      border-top: 1px solid var(--line);
      padding-top: 23px
    }

    .caregiver-title {
      display: flex;
      gap: 9px;
      font-size: .83rem;
      font-weight: 650;
      align-items: center
    }

    .switch-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      font-size: .75rem;
      color: var(--muted);
      cursor: pointer
    }

    .switch-row input {
      appearance: none;
      width: 35px;
      height: 21px;
      background: #b3c1b3;
      border-radius: 20px;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      margin: 0
    }

    .switch-row input::after {
      content: "";
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: white;
      position: absolute;
      left: 3px;
      top: 3px;
      transition: transform .2s
    }

    .switch-row input:checked {
      background: var(--teal)
    }

    .switch-row input:checked::after {
      transform: translateX(14px)
    }

    .journey-tip {
      font-size: .73rem;
      line-height: 1.6;
      color: var(--muted);
      padding: 0 12px 0 0;
      margin-top: 23px
    }

    .reset-btn {
      border: 0;
      border-bottom: 1px solid #a3b7ab;
      background: transparent;
      color: var(--muted);
      font-size: .72rem;
      padding: 9px 0;
      min-height: 36px
    }

    .stage {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 17px;
      overflow: hidden;
      box-shadow: 0 6px 22px #22391f08
    }

    .stage-top {
      padding: 23px 26px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .chapter {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      font-size: .69rem;
      font-weight: 650;
      color: var(--teal);
      letter-spacing: .4px
    }

    .chapter .icon {
      width: 17px;
      height: 17px
    }

    .listen {
      background: #eff4ec;
      border: 0;
      border-radius: 7px;
      display: flex;
      gap: 7px;
      align-items: center;
      font-size: .73rem;
      padding: 9px 11px;
      min-height: 38px
    }

    .listen:hover {
      background: #e0ebdd
    }

    .listen .icon {
      width: 16px;
      height: 16px
    }

    .stage-intro {
      padding: 0 26px
    }

    .stage h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 1.86rem;
      line-height: 1.2;
      letter-spacing: -.5px;
      margin: 16px 0 9px
    }

    .stage-desc {
      font-size: .89rem;
      line-height: 1.68;
      color: var(--muted);
      margin: 0 0 20px;
      max-width: 78ch
    }

    .figure {
      margin: 0 24px;
      background: #fffefb;
      border: 1px solid var(--rule);
      border-radius: 12px;
      overflow: hidden
    }

    .figure-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 15px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(#fbfcf8, #f4f7f1)
    }

    .figure-tag {
      font-size: .6rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      font-weight: 750;
      color: var(--teal)
    }

    .figure-scale {
      font-size: .6rem;
      letter-spacing: .7px;
      color: var(--soft);
      text-align: right
    }

    .plates {
      display: grid;
      grid-template-columns: minmax(0, 1.34fr) minmax(0, 1fr)
    }

    .plate {
      padding: 6px 4px 2px;
      min-width: 0
    }

    .plate+.plate {
      border-left: 1px solid var(--line);
      background: #fcfdfa
    }

    .plate-cap {
      font-size: .585rem;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: #6f8175;
      margin: 6px 0 0 12px;
      font-weight: 750
    }

    .plate-svg {
      width: 100%;
      height: auto
    }

    .plate-svg text {
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      fill: #2f4d42;
      font-size: calc(11px + (var(--scale) - 1) * 9px)
    }

    .plate-svg .cap {
      font-size: calc(9.5px + (var(--scale) - 1) * 8px);
      fill: #6b7d72
    }

    .plate-svg .lbl-bg {
      fill: #fffdf8;
      stroke: #cdd9cc;
      stroke-width: 1
    }

    .plate-svg .leader {
      fill: none;
      stroke: #93a894;
      stroke-width: 1.1
    }

    .plate-svg .dot {
      fill: #7d9a80
    }

    .figure-note {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: .63rem;
      color: #66796c;
      text-align: center;
      margin: 0;
      padding: 6px 12px 10px;
      border-top: 1px solid var(--line);
      background: #fafcf7
    }

    .figure-note .icon {
      width: 13px;
      height: 13px
    }

    .hotspots {
      display: flex;
      gap: 7px;
      padding: 12px 24px 0;
      flex-wrap: wrap
    }

    .hotspot {
      border: 1px solid #c8d8c7;
      border-radius: 20px;
      background: #fffefa;
      font-size: .68rem;
      padding: 8px 12px;
      min-height: 36px;
      font-weight: 600;
      color: #3f584c
    }

    .hotspot:hover {
      background: var(--mint)
    }

    .hotspot[aria-pressed="true"] {
      background: var(--teal);
      color: white;
      border-color: var(--teal)
    }

    .detail-note {
      margin: 14px 26px 18px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: .8rem;
      line-height: 1.62;
      color: var(--muted);
      min-height: 44px
    }

    .detail-note .icon {
      width: 18px;
      height: 18px;
      color: var(--teal);
      margin-top: 2px
    }

    .detail-note strong {
      color: var(--ink);
      font-weight: 700
    }

    .key-points {
      list-style: none;
      padding: 0 26px;
      margin: 15px 0 22px;
      display: grid;
      gap: 12px
    }

    .key-points li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: .85rem;
      line-height: 1.55
    }

    .key-points .icon {
      color: var(--teal);
      width: 18px;
      height: 18px;
      margin-top: 2px
    }

    .seq {
      padding: 2px 26px 18px
    }

    .seq-rail {
      display: flex;
      align-items: center;
      gap: 0;
      margin: 0 0 12px
    }

    .seq-dot {
      flex: 1;
      position: relative;
      border: 0;
      background: transparent;
      padding: 14px 0 6px;
      min-height: 44px
    }

    .seq-dot::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 20px;
      height: 3px;
      background: #dbe4d9
    }

    .seq-dot:first-child::before {
      left: 50%;
      border-radius: 3px 0 0 3px
    }

    .seq-dot:last-child::before {
      right: 50%;
      border-radius: 0 3px 3px 0
    }

    .seq-dot.past::before {
      background: #8fbb9c
    }

    .seq-dot span {
      position: relative;
      display: grid;
      place-items: center;
      width: 23px;
      height: 23px;
      margin: auto;
      border-radius: 50%;
      background: #fffefa;
      border: 2px solid #cbd8c9;
      font-size: .63rem;
      font-weight: 700;
      color: var(--muted)
    }

    .seq-dot.past span {
      border-color: #8fbb9c;
      background: #e4f0e4;
      color: var(--deep)
    }

    .seq-dot[aria-pressed="true"] span {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
      box-shadow: 0 0 0 4px #1d6c5e22
    }

    .seq-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap
    }

    .seq-bar .outline-btn {
      font-size: .73rem;
      padding: 8px 13px;
      min-height: 38px
    }

    .seq-count {
      font-size: .66rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--soft);
      font-weight: 700;
      margin-left: auto
    }

    .quiz {
      border-top: 1px solid var(--line);
      background: #fbfcf7;
      padding: 20px 26px
    }

    .quiz-label {
      font-size: .66rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      gap: 7px;
      align-items: center;
      font-weight: 650;
      color: var(--teal);
      margin-bottom: 9px
    }

    .quiz-label .icon {
      width: 16px;
      height: 16px
    }

    .quiz h3 {
      font-size: .88rem;
      font-weight: 600;
      margin: 0 0 13px;
      line-height: 1.5
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px
    }

    .answer {
      border: 1px solid #d3ded0;
      border-radius: 8px;
      background: white;
      padding: 12px;
      display: flex;
      text-align: left;
      align-items: center;
      gap: 9px;
      font-size: .78rem;
      line-height: 1.4;
      min-height: 52px
    }

    .answer:hover {
      border-color: var(--teal);
      background: #eff6ec
    }

    .radio-dot {
      border: 1.5px solid #b5c7b6;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: grid;
      place-items: center
    }

    .answer.selected {
      border-color: var(--teal);
      background: #e8f3e6
    }

    .answer.selected .radio-dot {
      border-color: var(--teal);
      background: var(--teal)
    }

    .answer.selected .radio-dot::after {
      content: "";
      height: 6px;
      width: 6px;
      border-radius: 50%;
      background: white
    }

    .answer.retry {
      background: #fff6e6;
      border-color: #b08434
    }

    .feedback {
      font-size: .8rem;
      line-height: 1.6;
      margin-top: 12px;
      color: var(--deep)
    }

    .feedback.retry-text {
      color: #71510f
    }

    .stage-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 12px
    }

    .back-btn {
      display: flex;
      gap: 8px;
      align-items: center;
      min-height: 45px;
      border: 0;
      background: transparent;
      font-size: .79rem;
      padding: 10px 3px
    }

    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--teal);
      color: white;
      border: 1px solid var(--teal);
      border-radius: 9px;
      padding: 13px 21px;
      font-size: .82rem;
      font-weight: 600;
      min-height: 46px
    }

    .primary:hover {
      background: var(--deep)
    }

    .nav-note {
      font-size: .66rem;
      color: var(--muted);
      text-align: center
    }

    .primary .icon,
    .back-btn .icon {
      width: 17px;
      height: 17px
    }

    .route {
      stroke-dasharray: 5 7;
      stroke-linecap: round
    }

    .route.animating {
      animation: route 4s linear infinite
    }

    @keyframes route {
      to {
        stroke-dashoffset: -48
      }
    }

    .right-panel {
      padding-top: 22px
    }

    .right-panel>.section-heading {
      margin: 0 0 19px 1px
    }

    .status-card {
      background: #edf2e8;
      border: 1px solid #dfe6d7;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 13px
    }

    .status-icon {
      height: 34px;
      width: 34px;
      border-radius: 50%;
      background: #dee9d9;
      color: #3f6a49;
      display: grid;
      place-items: center;
      margin-bottom: 11px
    }

    .status-icon .icon {
      height: 19px;
      width: 19px
    }

    .status-card h3 {
      font-size: .82rem;
      margin: 0 0 7px;
      font-weight: 650
    }

    .status-card p {
      font-size: .78rem;
      line-height: 1.65;
      color: var(--muted);
      margin: 0
    }

    .status-card:nth-of-type(2) {
      background: #ecf3f3;
      border-color: #dae6e3
    }

clinical training, healthcare professionals, and patients or family members who wish to see actual procedure steps.","gallerySensitiveWarning":"Because these photographs depict sterile drapes, needles, and a small incision, you can choose whether you wish to view real clinical images or remain with the calming illustrated guide.","viewPhotos":"View clinical photos (10 steps)","keepIllustrated":"Keep illustrated guide","consentTitle":"Informed Consent & Decision Companion","consentSub":"Interactive disclosure, quiz & verified record","consentQuickBtn":"Informed Consent Companion","consentCtaBtn":"Start Informed Consent Companion","consentModalTitle":"Informed Consent & Shared Decision Companion","consentReviewBtn":"Review this section again","consentProceedBtn":"I understand, proceed","consentStartBtn":"Begin Companion","consentDownloadBtn":"Download Discussion Record (A4 PDF)","consentPrintBtn":"Print Hospital Record","consentRecordDownloaded":"Your Informed Discussion Record (PDF) has been downloaded.","disclaimer":"This tool is for general education only. It does not replace a conversation with your nephrologist or PD nurse, and it is not medical advice.","sources":"About this guide & sources","offline":"Works offline","expect":"What to expect","caregiverLabel":"For your caregiver","caregiverOpen":"Open caregiver care card","urgentLink":"When to call your PD team","reassurance":"It’s okay to ask the same question again. Your comfort and understanding matter.","chapter":"STEP {n} OF 8 · {category}","completed":"Completed","current":"You are here","notCompleted":"Not yet completed","figureTag":"Figure {n}","figureScale":"Illustration · not to scale · your anatomy and placement will differ","layerNames":["Skin","Fatty layer","Muscle sheath (front)","Belly muscle","Muscle sheath (back)","Lining of the belly","Belly space"],"layerLines":[["Skin"],["Fatty","layer"],["Muscle sheath","(front)"],["Belly","muscle"],["Muscle sheath","(back)"],["Lining of","the belly"],["Belly","space"]],"cuffKey":["Inner cuff, seated in the muscle","Outer cuff, under the skin near the exit"],"scaleNote":"About 3-5 cm of belly wall, tip to skin","frontLabelLines":[["Exit","site"],["Under-skin","tunnel"],["Belly","space"],["Soft","catheter"],["Curled","tip"]],"markLabelLines":[["Midline"],["Navel"],["Edge of the","belly muscle"],["Belt","line"],["Possible","exit site"]],"exploreLabel":"Explore the parts of the catheter","plateDrape":"Front view · sterile drape and marked entry point","plateEffluent":"Close-up · what drained fluid looks like","drapeNote":"Only the marked window is exposed; the rest stays covered by sterile drapes throughout.","livingLabels":["Skin stays calm and dry","Secured, so it cannot tug","Exit points downward"],"plateFront":"Front view · the catheter in place","plateSection":"Cut-through view · the layers of the belly wall","plateSite":"Front view · choosing and marking the spot","plateNumb":"Cut-through view · where the numbing reaches","plateFlow":"Front view · checking that fluid runs in and out","plateCuff":"Close-up · how the cuffs seal over time","plateExit":"Close-up · a settled, healthy exit site","plateCompare":"Close-up · what a change looks like","markLabels":["Midline","Navel","Belt line","Edge of the belly muscle","Possible exit site"],"numbLabels":["A brief sting here","Then pressure here","Numb all the way down"],"flowLabels":["Fluid in","Fluid out","Dressing over the exit"],"cuffStages":["Day 0","About 2 weeks","About 6 weeks"],"cuffStageNotes":["The cuff is a soft fabric collar. Nothing is holding it yet — this is why the tube must not be tugged.","Your own tissue starts to grow into the fabric. The tube is becoming anchored.","Tissue has grown through the cuff and made a seal. This anchor is what keeps the tube in place for years."],"exitLabels":["Settled and healthy","Needs a call today"],"exitHealthyNotes":["Skin its normal colour","Dry, no crust or discharge","Tube not pulling"],"exitWarningNotes":["Redness spreading out","Crust, pus or discharge","Sore, swollen or warm"],"effluentLabels":["Clear","Cloudy"],"effluentNote":"A clear bag: you can read print through it. A cloudy bag: you cannot. Cloudy means call, even with no pain.","diagramAlts":{"anatomy":"Front view of the trunk showing the peritoneal dialysis catheter running from an exit site low on the abdomen, through a tunnel under the skin, into the belly space, with its coiled tip resting low in the pelvis. Beside it, a cut-through view of the belly wall shows skin, fat, muscle sheath, muscle, and the lining of the belly, with the inner cuff seated in the muscle and the outer cuff about two centimetres from the exit.","prepare":"Front view of the abdomen with the midline, navel, belt line, and edge of the belly muscle marked, and a shaded band low to one side showing where the exit site may be placed.","comfort":"Cut-through view of the belly wall shaded to show local anaesthetic spreading from the skin down through fat and muscle to the lining of the belly.","placement":"Front view of the trunk beside a cut-through view of the belly wall, showing the current stage of the bedside placement procedure.","recovery":"Front view of the trunk with the catheter in place, a bag of fluid running in and a drainage bag filling below, and a dressing over the exit site.","healing":"Three close-up views of a catheter cuff at day zero, two weeks, and six weeks, showing tissue gradually growing into the fabric cuff and sealing around the tube.","living":"Close-up of a healed exit site: the tube passes through calm, dry skin, points downward, and is held with a securing strip.","warnings":"Two close-up exit sites side by side, one calm and dry, one red with crust, and two drainage bags side by side, one clear and one cloudy."},"hotspotLabels":["The catheter","The exit site","The two cuffs","Where the tip rests","The lining that filters"],"hotspotDetails":[["Soft, and softer than you expect.","A silicone tube about the width of a drinking straw carries dialysis fluid into and out of the belly space. It bends easily and is not sharp. The end may be straight or coiled."],["A small opening you will learn to care for.","The tube passes through the skin low on your abdomen and is angled to point downward, so water and dirt drain away from it rather than into it. Only a short length stays outside."],["Two anchors, doing different jobs.","The inner cuff sits inside the belly muscle and seals the entry. The outer cuff sits under the skin about 2 cm from the exit and blocks germs from tracking inward. Both are soft fabric collars your own tissue grows into."],["Low in the pelvis, where the fluid gathers.","The tip rests in the lowest part of the belly space, behind the bladder, because fluid pools there under gravity. That is what lets the catheter drain well."],["The membrane doing the actual work.","The peritoneum lines your belly and covers the organs inside it. It is rich in tiny blood vessels, so waste and extra water pass from your blood into the dialysis fluid across it. The catheter only delivers and removes that fluid."]],"sequenceLabel":"Follow the placement, step by step","sequenceTitles":["Marked, cleaned and draped","Numbing, layer by layer","A small opening","Reaching the belly space","A cushion of fluid","A guide into the pelvis","The catheter follows the guide","The tunnel, the exit, and a flow check"],"sequenceDetails":["The spot marked at your earlier visit is checked again, usually about two finger-widths to one side of your navel. The skin is cleaned with antiseptic and sterile drapes are laid over you, leaving only that small window uncovered.","Local anaesthetic is placed into the skin first, then a little deeper each time, down through the fat and the muscle sheath to the lining of the belly. The first injection stings briefly; after that the area goes numb.","A short opening is made through the numbed skin, and the tissue is separated gently down to the sheath that covers the belly muscle. This is done with the area fully numb.","A fine needle is passed carefully through the sheath and muscle into the belly space. The team confirms it is in the right place before anything else is passed through it.","Warmed dialysis fluid is run in through the needle. It lifts the bowel gently away from the entry point and opens a clear space for the tube — a safety step that makes the rest of the placement easier.","A soft, flexible guidewire is passed through the needle and curled low into the pelvis. The needle is removed and the wire stays behind as a guide, so the catheter can follow the same path.","The opening is gently widened over the wire and a thin sleeve is passed. The catheter slides through the sleeve and down into the pelvis, the sleeve is peeled away, and the inner cuff is settled inside the belly muscle.","A short tunnel is made under the skin and the tube is drawn through it so the exit points downward. The outer cuff sits about 2 cm inside. Fluid is then run in and drained out to confirm the catheter works, and a dressing is applied."],"play":"Play the sequence","pause":"Pause","replay":"Replay from the start","sequenceStep":"Placement stage {n}","sequenceCount":"Stage {n} of 8","awakeNote":["You are awake for this.","The whole placement is usually done with the area numbed, at the bedside or in a procedure room. You can talk to the team throughout."],"warningIntro":"Call immediately for any of these signs. Do not wait for your next appointment.","warningItems":["New redness, pus, swelling, or pain at the exit site or along the tunnel","Fever or feeling unwell","Cloudy drained dialysis fluid, even if you feel well","New belly pain, even if the drained fluid looks clear","The tube is pulled, damaged, or seems to be coming out","Fluid leaking around the catheter"],"warningAction":"Do not push a displaced tube back in. If you cannot reach the PD team promptly, seek urgent medical care. For severe illness, use your local emergency service.","callDetails":"See contact details","languageUnavailable":"This translation is not yet available. The guide remains in English; ask your team for language support.","audioUnavailable":"Read-aloud is not available here. You can read the same words on screen with a caregiver.","audioOffline":"No offline English voice is installed. Use your device’s accessibility reader or read together.","audioError":"Audio could not start. The same information is available on screen.","textSizeChanged":"Text size: {n}%","pdfSaved":"Your one-page summary has been downloaded.","completionTitle":"You’ve made space for understanding.","completionBody":"You’ve explored all eight steps. Keep your questions, revisit anything, and talk with your care team before making a decision. Completing this guide does not record consent.","incompleteTitle":"There’s always room to come back.","incompleteBody":"You’ve reached the end. You can revisit the steps you skipped using the journey map, or take a summary to your care team.","close":"Close","print":"Print / save as PDF","download":"Download PDF","cancel":"Keep my progress","resetTitle":"Start a fresh journey?","resetBody":"This clears the completed steps and check-in answers on this page. No patient information is saved.","resetConfirm":"Start again","teamTitle":"Your questions are welcome","teamIntro":"Your PD nurse and kidney doctor can explain what is right for you. This guide supports that conversation; it is not informed consent counseling.","daytime":"PD team contact","afterHours":"After-hours contact","contactMissing":"Ask your clinic for this number and keep it with you.","questionsTitle":"You might like to ask","teamQuestions":["Why is this placement method suitable for me? What are the risks and alternatives?","Where will my exit site be, and when will it be marked?","What will help me feel comfortable during the procedure?","When should I stop eating, and which medicines should I take?","Who will change my first dressing, and when can I start dialysis?","Who should I call at night or on a weekend?"],"sourcesTitle":"About this guide","sourcesIntro":"A patient and family guide to percutaneous PD catheter placement at the bedside. It explains a needle-and-guidewire (Seldinger) method so you know what will happen and where the catheter sits. It does not teach anyone to perform the procedure.","reviewPending":"Local clinical review is pending. A nephrologist and PD nurse should confirm the content, contacts, illustrations, and local instructions before patient use.","reviewed":"Local review: {name} · {date}","sourcesHeading":"Clinical references","sourcesNote":"The ISPD guideline directory was checked on 7 September 2026. These references inform general education; they do not mean this app is endorsed by ISPD or by any of the groups listed. Source links need an internet connection.","sourceNames":["ISPD — Creating and maintaining optimal PD access in adults (2019)","ISPD — Catheter-related infection recommendations (2023)","ISPD — Peritonitis prevention and treatment (2022)","UKidney — Peritoneal dialysis catheter insertion at the bedside (video)"],"illustrationTitle":"About the illustrations","illustrationBody":"The drawings are original vector artwork made for this guide. They show the layers of the belly wall, the path of the catheter, and the sequence used in bedside percutaneous placement. They are simplified and are not to scale: layer thickness, body shape, and the exact placement vary from person to person. Nothing here is a photograph of a real patient.","privacyTitle":"Made for a calm learning space","privacyBody":"The guide makes no network requests, uses no analytics, and does not transmit personal information. Progress and consent discussion entries exist in-memory only while this page is open, are never stored on any server, and are cleared on page reload or reset. The informed discussion PDF is generated locally on your device. Audio uses an installed offline device voice when available. English is provided; Hindi and Marathi are translation placeholders.","handoutIntro":"A reminder to discuss with your PD team. Your individual instructions come first.","handoutHeads":["Before your visit","During placement","Healing and starting dialysis","Looking after the catheter","Call your PD team immediately"],"placementSummary":"The spot is marked and the skin is cleaned and draped. The area is numbed layer by layer. A needle and a soft guidewire are used to guide a soft tube into the belly space, with warmed fluid run in first to make room. A short tunnel under the skin brings the tube out through a downward-facing exit site, and two soft cuffs anchor it. Fluid is run in and out to check it works. You are usually awake with the area numbed; tell the team about pain.","checklistIntro":"For routine care after healing, once your PD nurse has trained you. For a newly placed catheter, follow the early dressing instructions below.","checklistItems":["Wash and dry your hands before care.","Look at the exit site and nearby skin each day.","Follow the cleaning schedule and use only the products your team recommends.","Use any prescribed ointment exactly as taught.","Keep the tube secured so it cannot tug; avoid tight clothing rubbing the site.","Know your PD team’s daytime and after-hours numbers."],"earlyCare":"While the site is healing","caregiverIntro":"You do not need to do everything. Agree with your loved one and the PD nurse on how you can help.","caregiverItems":["Ask what help feels useful; listen and write down questions.","Wash and dry your hands before helping with care.","Help look at the exit site without pulling the tube or disturbing a new dressing.","Only carry out care or exchanges after the PD team has trained you.","Keep supplies ready and support the team’s care plan.","Call the PD team immediately for the warning signs below."],"noteEmergency":"If you cannot reach the PD team promptly, seek urgent medical care. For severe illness, use your local emergency service.","phases":[{"name":"Meet your catheter","sub":"A small tube with a big purpose","category":"Getting familiar","title":"Meet your PD catheter","description":"Peritoneal dialysis uses the lining inside your belly — the peritoneum — to clean your blood. A soft silicone tube lets dialysis fluid flow in and out through that space. The drawings below show exactly where it runs: through the belly wall, along a tunnel under the skin, and down into the pelvis. Explore each part at your own pace.","visual":"anatomy","statuses":[["heart","A new routine, gently","It’s natural to have questions. You can learn a little at a time, and come back to any part of this."],["leaf","Designed to stay with you","Two soft cuffs anchor the tube as your own tissue grows into them. Only a short length stays outside, and it tucks under clothing."],["people","You’ll have support","Your PD nurse will teach you to use and care for the catheter before you do anything on your own."]],"caregiver":"Sit together and use the five buttons under the drawing. Ask what feels unclear and write those questions down for the PD nurse.","question":"What is the catheter there to do?","answers":["Let dialysis fluid move in and out of my belly space","Go into my stomach to carry food"],"correct":0,"yes":"That’s right. It carries dialysis fluid into and out of the belly space. It does not go anywhere near your stomach or your food.","no":"A helpful distinction: the tube sits in the belly space around your organs, not inside your stomach. It carries dialysis fluid only."},{"name":"Before your procedure","sub":"Marking the spot, together","category":"Preparing","title":"Choosing where the tube comes out","description":"Where your exit site sits matters for years, so it is chosen carefully and marked before the day — usually with you sitting or standing, in your normal clothes. The team keeps it away from your belt line, from skin folds and from old scars, and places it where you can actually see and reach it.","visual":"prepare","points":["markingInstructions","fastingInstructions","medicationInstructions","bowelInstructions","arrivalInstructions"],"statuses":[["clipboard","Your own preparation plan","Fasting and medicine instructions depend on your health and your center. Follow yours, not a friend’s."],["message","Tell your team","Mention allergies, blood-thinning medicines, past belly operations, and where your waistband normally sits."],["people","Plan some company","Ask who may come with you and arrange your trip home before the day."]],"caregiver":"Help gather the medicine list, written instructions, and questions. Confirm the transport plan, and remind the team about the clothing your loved one usually wears so the marking suits real life.","question":"Why is the exit site marked while you sit or stand?","answers":["To match a standard position for everyone","So it avoids your belt line and skin folds in real life"],"correct":1,"yes":"Exactly. Lying flat hides the folds and the waistband. Marking upright puts the exit somewhere that works when you are living your normal day.","no":"There is no standard spot. Marking is done upright so the site avoids your own belt line and skin folds when you sit and stand."},{"name":"Keeping you comfortable","sub":"Numbing & relaxation","category":"Your comfort","title":"Your comfort matters","description":"The area is numbed in layers: skin first, then a little deeper each time, down through the fat and muscle sheath to the lining of the belly. The first injection stings briefly. After that you may feel pressure or tugging, but not sharp pain. Light sedation may also be offered.","visual":"comfort","note":["You can speak up at any point.","Tell the team if you feel sharp pain, worry, or need something explained again. Nothing about this has to be endured quietly."],"statuses":[["heart","What you may feel","A brief sting, then pressure or tugging as the tube is guided. Sharp pain is not expected — say so if you feel it."],["leaf","Awake or lightly drowsy","This is usually done with local anaesthetic rather than a general anaesthetic. Sedation is optional and depends on your needs and your team’s plan."],["people","Someone is looking after you","A member of the team stays with you and checks how you are feeling throughout."]],"caregiver":"Tell the team beforehand about your loved one’s worries, hearing needs, or preferred language. Ask whether you can be nearby.","question":"If I feel sharp pain, what should I do?","answers":["Tell the team right away","Stay quiet and wait for it to finish"],"correct":0,"yes":"Yes. Say so immediately — more local anaesthetic can be given, and comfort is part of doing this well.","no":"You do not have to stay quiet. Sharp pain means the team should add more numbing. Tell them right away."},{"name":"Placing the catheter","sub":"Follow the eight stages","category":"The procedure","title":"The bedside placement, stage by stage","description":"This is the percutaneous method: no large incision, and usually no general anaesthetic. A needle and a soft guidewire guide the tube into place through a small opening. Follow all eight stages below, or play them in sequence. Instruments are drawn as simple shapes, and nothing graphic is shown.","visual":"placement","statuses":[["leaf","A small opening","A short opening, not a large cut. The tube is guided in over a wire rather than through open surgery."],["clock","One stage at a time","Ask your team how long your own procedure and the observation afterwards are likely to take."],["shield","A check before you leave","Fluid is run in and drained out to confirm the catheter works before the dressing goes on."]],"caregiver":"This is a simplified map so your loved one knows what is happening, not instructions for carrying it out. Ask the team to explain anything the drawing leaves out.","question":"Why is warm fluid run into the belly before the tube goes in?","answers":["To lift the bowel gently away and make a clear space","To warm the patient up"],"correct":0,"yes":"That’s right. The fluid floats the bowel away from the entry point, which makes room for the catheter and is an important safety step.","no":"It is a safety step, not a warming one: the fluid lifts the bowel away from the entry point so there is a clear space for the tube."},{"name":"Right after placement","sub":"Rest, check & recover","category":"Early recovery","title":"Time to rest and check in","description":"Before you go anywhere, the team runs fluid in and drains it out again to confirm the catheter flows freely in both directions. Mild soreness around the site is common for a few days. Tell the team about pain that is strong, getting worse, or different from what you were told to expect.","visual":"recovery","points":["dischargeInstructions","dressingInstructions"],"statuses":[["heart","A little soreness is possible","Aching around the site for a few days is usual. Strong or worsening pain is not — say so."],["clipboard","Before heading home","Make sure you leave knowing your dressing plan, your follow-up date, and who to call."],["people","A supported trip home","If you had sedation, follow the team’s travel and supervision instructions and do not drive yourself."]],"caregiver":"Listen to the discharge instructions together and write them down. Help with the journey home, and make sure the after-hours number is saved in a phone before you leave.","question":"What should I know before leaving?","answers":["Only the date of my next visit","My care plan, my follow-up date, and who to call"],"correct":1,"yes":"Yes. Ask for written instructions and a number for help, including after hours.","no":"The date matters, and so do your care plan and your contact numbers. Ask for all three before you leave."},{"name":"Giving your body time","sub":"The break-in period","category":"Healing","title":"Let your catheter settle in","description":"The break-in period is not just waiting. Your own tissue is growing into the two fabric cuffs, and that ingrowth is what anchors the tube and seals the tunnel against infection. Until it happens, the catheter is only resting in place — which is why it must not be tugged.","visual":"healing","points":["dialysisStartInstructions","dressingInstructions","activityInstructions"],"statuses":[["clock","At least 2 weeks, when possible","ISPD guidance favours a planned break-in of at least two weeks. Your team chooses your start date."],["shield","Protect the dressing","Keep it dry and undisturbed. Ask your team for help if it is wet, dirty, loose, or blood-soaked."],["leaf","Be gentle with yourself","Avoid straining and heavy lifting. Follow your constipation prevention plan — straining puts pressure on a healing site."]],"caregiver":"Take on the lifting and the chores that involve straining. Keep the follow-up plan somewhere visible, and leave early dressing changes to the PD team.","question":"When should I begin dialysis exchanges?","answers":["As soon as I feel ready","Only when my PD team tells me to"],"correct":1,"yes":"Exactly. Feeling well and being healed are different things. Your team chooses the safe start date and teaches you the plan.","no":"Feeling ready does not mean the cuffs have sealed. Start only when your team says so."},{"name":"Living with your catheter","sub":"Small habits, daily care","category":"Life at home","title":"Build a gentle care routine","description":"Once the site has healed, your PD nurse will teach you to look after it. A settled exit site is calm, dry, and unremarkable — that is what you are checking for each day. Keep the tube secured so it cannot tug, and choose clothing that does not rub across it.","visual":"living","points":["dailyCareInstructions","bathingInstructions","activityInstructions"],"statuses":[["clipboard","Learn, then practise","Ask your nurse to watch you do the routine yourself before you do it alone at home."],["droplet","Water needs a plan","Showering, bathing, and swimming carry different risks. Get advice for each one separately."],["leaf","Make room for daily life","Talk about your actual work, hobbies, and exercise so the plan fits the life you have."]],"caregiver":"With permission, help look at the site — a second pair of eyes catches change early. Wash your hands first, and only carry out tasks the PD team has taught you.","question":"When is it okay to start showering?","answers":["When my PD team says the site is ready","As soon as I get home"],"correct":0,"yes":"That’s right. Your team will tell you when the site has healed enough and how to protect it.","no":"A new site needs to stay dry. Ask your team when it is ready and how to cover it."},{"name":"When to call your team","sub":"Know the warning signs","category":"Getting help","title":"Notice a change? Make the call.","description":"You will know your own exit site better than anyone. The two comparisons below show what a change looks like. If you see any of these, call your PD team immediately, even if you feel completely well and even if you are unsure.","visual":"warnings","statuses":[["phone","Call right away","Do not wait for your next visit and do not wait to see whether it settles overnight."],["message","Say what has changed","Describe pain, fever, how the exit site looks, and any change in the drained fluid."],["shield","If you cannot reach them","Seek urgent medical care. Use your local emergency service for severe illness."]],"caregiver":"Help make the call and describe what has changed. Cloudy drained fluid needs an immediate call even when your loved one feels completely well.","question":"The drained fluid looks cloudy, but I feel fine. What now?","answers":["Wait until tomorrow to see if it clears","Call my PD team immediately"],"correct":1,"yes":"Yes. Cloudy fluid can be the first sign of infection and often appears before any pain. Call immediately.","no":"Please do not wait. Cloudy fluid needs an immediate call even if you feel well — it can be the earliest sign of रे से पेट की मांसपेशी को ढकने वाले आवरण तक अलग किया जाता है। यह पूरी तरह सुन्न अवस्था में किया जाता है।","एक बारीक सुई को आवरण और मांसपेशी के माध्यम से पेट की गुहा में सावधानी से पहुँचाया जाता है। आगे बढ़ने से पहले टीम सुनिश्चित करती है कि सुई बिल्कुल सही जगह पर है।","सुई के माध्यम से हल्का गर्म डायलिसिस तरल अंदर डाला जाता है। यह आंतों को प्रवेश बिंदु से धीरे से अलग कर देता है और नली के लिए सुरक्षित जगह बनाता है — यह एक महत्वपूर्ण सुरक्षा कदम है।","सुई के माध्यम से एक मुलायम, लचीला गाइडवायर डाला जाता है और श्रोणि में घुमाया जाता है। सुई निकाल ली जाती है और तार एक गाइड के रूप में अंदर रहता है ताकि कैथेटर उसी रास्ते जा सके।","गाइडवायर के ऊपर रास्ते को धीरे से चौड़ा किया जाता है और एक पतली आस्तीन (शीथ) डाली जाती है। कैथेटर शीथ के माध्यम से श्रोणि में सरक जाता है, शीथ को हटा दिया जाता है, और आंतरिक कफ मांसपेशी में बैठ जाता है।","त्वचा के नीचे एक छोटी सुरंग बनाई जाती है और नली को नीचे की ओर मुँह करके बाहर निकाला जाता है। बाहरी कफ लगभग 2 सेमी अंदर रहता है। फिर तरल डालकर और निकालकर जांच की जाती है, और ड्रेसिंग लगाई जाती है।"],"play":"प्रक्रिया चलाएं","pause":"रोकें","replay":"शुरुआत से दोबारा चलाएं","sequenceStep":"प्रक्रिया चरण {n}","sequenceCount":"चरण 8 में से {n}","awakeNote":["आप इस दौरान पूरी तरह होश में रहते हैं।","यह पूरी प्रक्रिया आमतौर पर केवल उस हिस्से को सुन्न करके, बेडसाइड या प्रोसीजर रूम में की जाती है। आप पूरी प्रक्रिया के दौरान टीम से बात कर सकते हैं।"],"warningIntro":"इनमें से कोई भी लक्षण दिखने पर तुरंत कॉल करें। अपनी अगली अपॉइंटमेंट का इंतज़ार न करें।","warningItems":["निकास स्थल पर या सुरंग के साथ नई लालिमा, मवाद, सूजन या दर्द","बुखार या अस्वस्थ महसूस होना","डायलिसिस का निकाला गया तरल धुंधला दिखना, भले ही आप ठीक महसूस कर रहे हों","पेट में नया दर्द, भले ही निकला हुआ तरल बिल्कुल साफ दिखे","नली खिंच गई हो, क्षतिग्रस्त हो गई हो, या बाहर निकलती दिख रही हो","कैथेटर के चारों ओर से तरल का रिसाव"],"warningAction":"बाहर निकली हुई नली को कभी अंदर धकेलने की कोशिश न करें। यदि आप अपनी पीडी टीम से तुरंत संपर्क नहीं कर पाते हैं, तो तत्काल आपातकालीन चिकित्सा सहायता लें। रून पाणी आणि घाण तिच्यापासून दूर राहील. केवळ एक लहान भाग बाहेर राहतो."],["दोन सुरक्षा लंगर, वेगवेगळे कार्य करतात.","आतील कफ पोटाच्या स्नायूमध्ये बसून आतील छिद्र बंद करतो. बाहेरील कफ एक्झिटपासून सुमारे 2 सेमी त्वचेखाली राहतो आणि जंतूंना आत जाण्यापासून रोखतो. दोन्ही मऊ कापडी कॉलर असतात ज्यामध्ये तुमचे स्वतःचे टिश्यू वाढतात."],["पेल्विसच्या खालच्या भागात, जिथे द्रव साठतो.","नळीचे टोक पोटाच्या सर्वात खालच्या भागात, मूत्राशयाच्या मागे बसते, कारण गुरुत्वाकर्षणामुळे द्रव तिथे साठतो. यामुळे कॅथेटरमधून द्रव सहज बाहेर वाहू शकतो."],["रक्त स्वच्छ करणारा प्रत्यक्ष पडदा.","पेरिटोनियम तुमच्या पोटाच्या आतील भागाला आणि अवयवांना झाकतो. यामध्ये असंख्य सूक्ष्म रक्तवाहिन्या असतात, ज्यामुळे रक्तातील टाकाऊ पदार्थ आणि अतिरिक्त पाणी डायलिसिस द्रवात शोषले जाते. कॅथेटर फक्त हे द्रव आत नेण्याचे आणि बाहेर काढण्याचे काम करते."]],"sequenceLabel":"कॅथेटर बसवण्याची प्रक्रिया टप्प्याटप्प्याने पहा","sequenceTitles":["खूण करणे, निर्जंतुकीकरण व आच्छादन","सुन्न करणे, थराथराने","एक लहान प्रवेशद्वार","पोटाच्या आतील पोकळीत पोहोचणे","सुरक्षिततेसाठी द्रवाचा गादीसारखा थर","पेल्विसमध्ये एक लवचिक मार्गदर्शक","कॅथेटर गाईडच्या मार्गाने पुढे सरकते","बोगदा, एक्झिट जागा आणि प्रवाह तपासणी"],"sequenceDetails":["तुमच्या आधीच्या भेटीत चिन्हांकित केलेल्या जागेची पुन्हा खात्री केली जाते, साधारणतः नाभीपासून दोन बोटांच्या अंतरावर. त्वचा अँटीसेप्टिकने स्वच्छ केली जाते आणि निर्जंतुक कापड पसरवले जाते, फक्त ती लहान खिडकी उघडी ठेवली जाते.","स्थानिक भूल प्रथम त्वचेमध्ये दिली जाते, नंतर हळूहळू खोलवर, चरबी आणि स्नायूच्या आवरणातून पोटाच्या आतील पडद्यापर्यंत. पहिले इंजेक्शन थोडे टोचते; त्यानंतर तो संपूर्ण भाग सुन्न होतो.","सुन्न केलेल्या त्वचेवर एक लहान चीरा दिला जातो आणि ऊतक हळूवारपणे पोटाच्या स्नायूच्या आवरणापर्यंत बाजूला केले जातात. हे पूर्णपणे सुन्न अवस्थेत केले जाते.","एक बारीक सुई आवरणातून आणि स्नायूमधून पोटाच्या पोकळीत काळजीपूर्वक नेली जाते. पुढे जाण्यापूर्वी सुई योग्य ठिकाणी असल्याची खात्री केली जाते.","सुईतून कोमट डायलिसिस द्रव आत सोडले जाते. यामुळे आतडी प्रवेश बिंदूपासून हळूवारपणे दूर होतात आणि नळीसाठी सुरक्षित जागा तयार होते — ही एक महत्त्वाची सुरक्षा पायरी आहे.","सुईतून एक मऊ, लवचिक गाईडवायर आत सोडली जाते आणि पेल्विसमध्ये वळवली जाते. सुई काढली जाते आणि तार मागे मार्गदर्शक म्हणून राहते जेणेकरून कॅथेटर त्याच मार्गाने जाऊ शकेल.","तारेवरील मार्ग हळूहळू रुंद केला जातो आणि एक पातळ आवरण (शीथ) आत सरकवले जाते. कॅथेटर शीथद्वारे पेल्विसमध्ये सरकते, शीथ काढून टाकले जाते आणि आतील कफ स्नायूमध्ये घट्ट बसवला जातो.","त्वचेखाली एक लहान बोगदा तयार केला जातो आणि नळीचे तोंड खालच्या दिशेने ठेवून बाहेर काढली जाते. बाहेरील कफ सुमारे 2 सेमी आत बसतो. नंतर द्रव आत सोडून आणि बाहेर काढून नळी व्यवस्थित चालत असल्याची खात्री केली जाते आणि मलमपट्टी केली जाते."],"play":"प्रक्रिया सुरू करा","pause":"थांबवा","replay":"सुरुवातीपासून पुन्हा पहा","sequenceStep":"प्रक्रिया टप्पा {n}","sequenceCount":"टप्पा 8 पैकी {n}","awakeNote":["तुम्ही या दरम्यान पूर्ण जागे असता.","ही संपूर्ण प्रक्रिया सामान्यतः केवळ ती जागा सुन्न करून, बेडसाइड किंवा कार्यपद्धती कक्षात केली जाते. तुम्ही प्रक्रियेदरम्यान टीमशी सतत बोलू शकता."],"warningIntro":"यापैकी कोणतेही लक्षण दिसल्यास त्वरित फोन करा. पुढच्या भेटीची अजिबात वाट पाहू नका.","warningItems":["एक्झिट जागेवर किंवा टनेलमध्ये नवी लाली, पू, सूज किंवा वेदना","ताप येणे किंवा अस्वस्थ वाटणे","बाहेर पडणारा डायलिसिस द्रव गढूळ दिसणे, जरी तुम्हाला बरे वाटत असले तरीही","पोटात नवीन वेदना होणे, जरी बाहेर पडणारा द्रव स्वच्छ दिसत असला तरीही","नळी ओढली गेली असणे, खराब होणे किंवा बाहेर येत असल्यासारखी दिसणे","कॅथेटरच्या आजूबाजूने द्रव गळणे"],"warningAction":"बाहेर आलेली नळी कधीही आत ढकलण्याचा प्रयत्न करू नका. जर तुम्ही पीडी टीमशी त्वरित संपर्क साधू शकत नसाल, तर तातडीने वैद्यकीय मदत घ्या. गंभीर आजारासाठी स्थानिक आपत्कालीन सेवेचा वापर करा.","callDetails":"संपर्क माहिती पहा","languageUnavailable":"हे भाषांतर अद्याप उपलब्ध नाही. मार्गदर्शक इंग्रजीत राहील; भाषेच्या मदतीसाठी तुमच्या टीमला विचारा.","audioUnavailable":"येथे ऑडिओ वाचन उपलब्ध नाही. तुम्ही काळजीवाहू व्यक्तीसोबत स्क्रीनवरील माहिती वाचू शकता.","audioOffline":"ऑफलाईन आवाज उपलब्ध नाही. तुमच्या डिव्हाइसच्या स्क्रीन रीडरचा वापर करा.","audioError":"ऑडिओ सुरू     hi: [{"title":"प्रारंभिक पेरिटोनियल पंक्चर","sub":"स्थानीय एनेस्थीसिया के तहत नाभि के नीचे प्रवेश","image":"assets/clinical/step-1-needle-puncture.webp","alt":"चिकित्सक निचले पेट में स्टॉपकॉक के साथ 18-गेज इंट्रोड्यूसर सुई डालते हुए","instruments":["18G इंट्रोड्यूसर सुई","2-वे स्टॉपकॉक","स्थानीय एनेस्थेटिक (1% लिडोकेन)"],"action":"स्थानीय सुन्न करने के बाद नाभि के नीचे 1.5-2 सेमी का एक छोटा त्वचा चीरा लगाया जाता है। चिकित्सक त्वचा के नीचे के ऊतकों और पेरिटोनियम के माध्यम से 18G सुई डालते हैं।","rationale":"जनरल एनेस्थीसिया के बिना पेट की गुहा में सीधा प्रवेश। स्टॉपकॉक गैस या तरल के अचानक रिसाव को रोकने के लिए त्वरित बंद करने की अनुमति देता है।","correlation":"गाइड चरण 4 से संबंधित · पेट की आंतरिक गुहा तक पहुँचना: एक बारीक सुई सावधानी से मांसपेशी और पेरिटोनियम के पार जाती है।"},{"title":"सलाइन हाइड्रोडिसेक्शन एवं विसरल क्लीयरेंस","sub":"आंतों को सुरक्षित दूर करने के लिए 500-1000 mL तरल डालना","image":"assets/clinical/step-2-hydrodissection.webp","alt":"आईवी इन्फ्यूजन सेट के माध्यम से पेरिटोनियल कैविटी में सलाइन प्रवाहित करना","instruments":["गर्म स्टेराइल नॉर्मल सलाइन / डायलिसेट","आईवी इन्फ्यूजन सेट","प्रेशर इन्फ्यूसर कफ"],"action":"500 से 1000 mL गर्म स्टेराइल सलाइन को सुई के माध्यम से गुरुत्वाकर्षण द्वारा तेजी से पेट की गुहा में डाला जाता है।","rationale":"आंतों को तैरते हुए पीछे धकेल देता है, जिससे आंत के छिद्रित होने का जोखिम 0.5% से भी कम हो जाता है।","correlation":"गाइड चरण 5 से संबंधित · सुरक्षा के लिए तरल का कुशन: गर्म तरल आंतों को दूर हटाकर कैथेटर के लिए सुरक्षित जगह बनाता है।"},{"title":"श्रोणि (पेल्विस) में जे-टिप गाइडवायर डालना","sub":"रेडियो-ओपेक फ्लेक्सिबल गाइडवायर को गहराई में पहुँचाना","image":"assets/clinical/step-3-guidewire-advance.webp","alt":"स्टॉपकॉक कैन्युला के माध्यम से 0.038 इंच जे-टिप गाइडवायर डालना","instruments":["0.038\" जे-टिप गाइडवायर","फ्लेक्सिबल इंसर्शन टिप"],"action":"एक मुलायम जे-टिप गाइडवायर को सुई के माध्यम से श्रोणि के निचले हिस्से में सरकाया जाता है। इसके बाद सुई को बाहर निकाल लिया जाता है।","rationale":"लचीला जे-आकार आंतरिक अंगों को नुकसान पहुँचाए बिना तार को नीचे की ओर मुड़ने देता है, जिससे कैथेटर के लिए सुरक्षित मार्ग बनता है।","correlation":"गाइड चरण 6 से संबंधित · श्रोणि में एक लचीला गाइड: एक मुलायम तार गाइड के रूप में अंदर रहता है।"},{"title":"डाइलेटर और पील-अवे शीथ को आगे बढ़ाना","sub":"गाइडवायर के ऊपर से प्रवेश मार्ग का विस्तार","image":"assets/clinical/step-4-dilator-sheath-advance.webp","alt":"गाइडवायर के ऊपर डाइलेटर और स्प्लिट-शीथ डालते हुए","instruments":["टेपर्ड वैस्कुलर डाइलेटर","टीयर-अवे / पील-अवे शीथ","स्केल्पल ब्लेड"],"action":"चीरे को थोड़ा चौड़ा किया जाता है, और टेपर्ड डाइलेटर तथा पील-अवे शीथ को गाइडवायर के ऊपर से श्रोणि की दिशा में आगे बढ़ाया जाता है।","rationale":"यह ऊतकों को धीरे-धीरे फैलाकर कैथेटर के आसानी से जाने के लिए एक सुरक्षित रास्ता तैयार करता है।","correlation":"गाइड चरण 7 से संबंधित · कैथेटर गाइड के रास्ते आगे बढ़ता है: रास्ते को धीरे से चौड़ा किया जाता है और एक पतली शीथ डाली जाती है।"},{"title":"पेट की गुहा में शीथ को स्थापित करना","sub":"अंतिम श्रोणि कोण और गाइडवायर निकालना","image":"assets/clinical/step-5-sheath-pelvic-seating.webp","alt":"45 डिग्री के कोण पर पेट की दीवार पर बैठी पील-अवे शीथ","instruments":["पील-अवे शीथ","हब लॉकिंग कॉलर"],"action":"शीथ को 45° के कोण पर श्रोणि में तब तक आगे बढ़ाया जाता है जब तक कि उसका हब त्वचा पर न बैठ जाए। फिर आंतरिक डाइलेटर और गाइडवायर निकाल लिए जाते हैं।","rationale":"कठोर और नुकीले तारों को हटाते हुए कैथेटर डालने के लिए एक सुरक्षित प्लास्टिक नली छोड़ता है।","correlation":"गाइड चरण 7 से संबंधित: मुलायम सिलिकॉन नली डालने के लिए प्रवेश मार्ग पूरी तरह तैयार।"},{"title":"कैथेटर प्रवेश एवं आंतरिक कफ की स्थापना","sub":"आंतरिक डैक्रॉन कफ के साथ सिलिकॉन नली को आगे बढ़ाना","image":"assets/clinical/step-6-catheter-cuff-feed.webp","alt":"पील-अवे शीथ के माध्यम से डाला गया सिलिकॉन कैथेटर जिसमें सफेद डैक्रॉन कफ दिख रहा है","instruments":["सिलिकॉन टेनकॉफ कैथेटर","डीप डैक्रॉन कफ","पील-अवे शीथ टैब्स"],"action":"सिलिकॉन कैथेटर को शीथ के माध्यम से तब तक डाला जाता है जब तक कि आंतरिक डैक्रॉन कफ रेक्टस मांसपेशी के स्तर तक न पहुँच जाए।","rationale":"2 सप्ताह के हीलिंग समय में शरीर के ऊतक इस कपड़े के कफ में बढ़ जाते हैं, जिससे तरल रिसाव और संक्रमण के खिलाफ एक अभेद्य सील बन जाती है।","correlation":"गाइड चरण 7 से संबंधित: आंतरिक कफ पेट की मांसपेशी के अंदर मजबूती से स्थापित होता है।"},{"title":"स्टाइलिट द्वारा श्रोणि में गहरी स्थापना","sub":"घुमावदार सिरे का श्रोणि के निचले हिस्से में पहुँचना सुनिश्चित करना","image":"assets/clinical/step-7-stylet-pelvic-placement.webp","alt":"धातु के स्टाइलिट द्वारा कैथेटर को श्रोणि में नीचे ले जाना","instruments":["मेटालिक स्टिफनिंग स्टाइलिट","पेल्विक पिगटेल / कर्ल्ड टिप"],"action":"एक लंबा धातु का स्टाइलिट ऑपरेटर को लचीले सिलिकॉन कैथेटर को श्रोणि में गहराई तक निर्देशित करने में मदद करता है ताकि वह मुड़कर ऊपर न आए।","rationale":"निचला स्थान गुरुत्वाकर्षण द्वारा डायलिसिस तरल के पूर्ण निकास को सुनिश्चित करता है और कैथेटर को खिसकने से रोकता है।","correlation":"गाइड चरण 7-8 से संबंधित: घुमावदार सिरा मूत्राशय के पीछे श्रोणि के सबसे निचले हिस्से में बैठता है।"},{"title":"शीथ को छीलना और निकास स्थल तक सुरंग बनाना","sub":"शीथ को हटाना और त्वचा के नीचे सुरंग तैयार करना","image":"assets/clinical/step-8-peel-away-cuff-seat.webp","alt":"पील-अवे शीथ को दो भागों में अलग करना और त्वचा के नीचे टनलिंग","instruments":["स्प्लिट-शीथ टैब्स","सबक्यूटेनियस टनलिंग ट्रोकार","सुपरफिशियल कफ"],"action":"पील-अवे शीथ को दो भागों में चीरकर बाहर निकाल लिया जाता है। एक टनलिंग टूल की मदद से कैथेटर को नीचे की ओर मुँह किए निकास स्थल तक खींचा जाता है।","rationale":"नीचे की ओर झुका हुआ निकास स्थल पानी या पसीने को सुरंग के अंदर जाने से रोकता है, जिससे संक्रमण का खतरा बहुत कम हो जाता है।","correlation":"गाइड चरण 8 से संबंधित · सुरंग, निकास स्थल और प्रवाह परीक्षण: बाहरी कफ त्वचा के 2 सेमी अंदर रहता है।"},{"title":"तत्काल तरल प्रवाह एवं पेटेंसी परीक्षण","sub":"तेज़ इनफ्लो और स्पष्ट आउटफ्लो का सत्यापन","image":"assets/clinical/step-9-fluid-patency-test.webp","alt":"कैथेटर से जुड़े 60 mL सिरिंज और ट्रांसफर सेट से प्रवाह की जांच","instruments":["कैथेटर एडॉप्टर / ट्रांसफर सेट","60 mL सिरिंज","डायलिसेट / सलाइन"],"action":"कैथेटर को ट्रांसफर सेट से जोड़ा जाता है। 100-200 mL सलाइन या डायलिसेट तेजी से अंदर डाला जाता है और गुरुत्वाकर्षण द्वारा बाहर निकालकर स्वतंत्र प्रवाह की पुष्टि की जाती है।","rationale":"प्रोसीजर रूम छोड़ने से पहले तत्काल पुष्टि कि नली में कोई रुकावट, मुड़ाव या खून का थक्का नहीं है।","correlation":"गाइड चरण 8 से संबंधित: ड्रेसिंग लगाने से पहले यह पुष्टि की जाती है कि तरल आसानी से आ-जा रहा है।"},{"title":"सीएपीडी कैथेटर स्थापना पूर्ण एवं ट्रांसफर सेट संयोजन","sub":"अंतिम बाह्य संरचना, टाइटेनियम एडॉप्टर एवं मिनीकैप सील","image":"assets/clinical/step-10-catheter-complete.webp","alt":"पेट का दृश्य जिसमें पूरा स्थापित सीएपीडी कैथेटर निकास स्थल से बाहर आकर टाइटेनियम एडॉप्टर और ट्रांसफर सेट से जुड़ा हुआ दिखाई दे रहा है","instruments":["टाइटेनियम कैथेटर एडॉप्टर","पीडी ट्रांसफर सेट (ट्विस्ट क्लैंप)","पोविडोन-आयोडीन मिनीकैप","बाह्य सिलिकॉन कैथेटर"],"action":"सीएपीडी कैथेटर डालने की प्रक्रिया पूरी हो चुकी है। एक टाइटेनियम कनेक्टर बाहर निकले सिलिकॉन कैथेटर को ट्रांसफर सेट से जोड़ता है, जिसे पोविडोन-आयोडीन मिनीकैप से सील किया जाता है। निकास स्थल पर खिंचाव से बचने के लिए नली को एक सौम्य मोड़ दिया जाता है।","rationale":"तनाव-मुक्त और नीचे की ओर उन्मुख विन्यास घाव भर रहे डैक्रॉन कफ पर यांत्रिक खिंचाव को रोकता है और निकास स्थल पर चोट के जोखिम को कम करता है। बंद ट्रांसफर सेट और मिनीकैप 2 सप्ताह के ब्रेक-इन समय में रोगाणुमुक्त बंद प्रणाली बनाए रखते हैं।","correlation":"गाइड चरण 7 से संबंधित · कैथेटर के साथ जीवन: निकास स्थल सुरक्षित, खिंचाव-मुक्त और घाव भरने के लिए सीलबंद।"}],
    mr: [{"title":"प्राथमिक पेरिटोनियल पंक्चर","sub":"स्थानिक भूल देऊन नाभीखाली प्रवेश","image":"assets/clinical/step-1-needle-puncture.webp","alt":"डॉक्टर पोटाच्या खालच्या भागात स्टॉपकॉकसह 18-गेज सुई टोचताना","instruments":["18G इंट्रोड्यूसर सुई","2-वे स्टॉपकॉक","स्थानिक भूल (1% लिग्नोकेन)"],"action":"स्थानिक भूल दिल्यानंतर नाभीखाली 1.5-2 सेमीचा लहान चीरा दिला जातो. डॉक्टर त्वचेखालील ऊतक आणि पेरिटोनियममधून 18G सुई आत नेतात.","rationale":"संपूर्ण भूल न देता पोटाच्या पोकळीत थेट प्रवेश. स्टॉपकॉक वायू किंवा द्रवाची अचानक गळती रोखण्यासाठी झडप त्वरित बंद करण्यास मदत करतो.","correlation":"मार्गदर्शक टप्पा 4 शी संबंधित · पोटाच्या आतील पोकळीत पोहोचणे: एक बारीक सुई काळजीपूर्वक स्नायू आणि पेरिटोनियममधून आत जाते."},{"title":"सलाईन हायड्रोडिसेक्शन आणि अवयव संरक्षण","sub":"आतडी दूर करण्यासाठी 500-1000 mL द्रव आत सोडणे","image":"assets/clinical/step-2-hydrodissection.webp","alt":"आयव्ही इन्फ्युजन सेटद्वारे पोटाच्या पोकळीत सलाईन सोडणे","instruments":["कोमट निर्जंतुक सलाईन / डायलिसेट","आयव्ही इन्फ्युजन सेट","प्रेशर कफ"],"action":"सुईद्वारे 500 ते 1000 mL कोमट सलाईन वेगाने पोटाच्या पोकळीत सोडले जाते.","rationale":"आतड्यांना प्रवेश बिंदूपासून दूर तरंगवते, ज्यामुळे आतड्याला इजा होण्याचा धोका 0.5% पेक्षाही कमी होतो.","correlation":"मार्गदर्शक टप्पा 5 शी संबंधित · सुरक्षिततेसाठी द्रवाचा गादीसारखा थर: कोमट द्रव आतड्यांना दूर ठेवून सुरक्षित जागा तयार करतो."},{"title":"पेल्विसमध्ये जे-टिप गाईडवायर सोडणे","sub":"रेडिओ-अपारदर्शक लवचिक गाईडवायर खोलवर नेणे","image":"assets/clinical/step-3-guidewire-advance.webp","alt":"कॅन्युलाद्वारे 0.038 इंच जे-टिप गाईडवायर सोडताना","instruments":["0.038\" जे-टिप गाईडवायर","लवचिक इन्सर्शन टिप"],"action":"एक मऊ जे-टिप गाईडवायर सुईद्वारे पेल्विसच्या खालच्या भागात सरकवली जाते. त्यानंतर सुई बाहेर काढली जाते.","rationale":"लवचिक जे-आकार अवयवांना इजा न करता तारेला वळण्यास मदत करतो, ज्यामुळे कॅथेटरसाठी सुरक्षित मार्ग तयार होतो.","correlation":"मार्गदर्शक टप्पा 6 शी संबंधित · पेल्विसमध्ये एक लवचिक मार्गदर्शक: एक मऊ तार मार्गदर्शक म्हणून मागे राहते."},{"title":"डायलेटर आणि पील-अवे शीथ पुढे सरकवणे","sub":"गाईडवायरवरून प्रवेश मार्गाचा विस्तार करणे","image":"assets/clinical/step-4-dilator-sheath-advance.webp","alt":"गाईडवायरवरून डायलेटर आणि स्प्लिट-शीथ घालताना","instruments":["टेपर्ड डायलेटर","टीअर-अवे / पील-अवे शीथ","ब्लेड"],"action":"चीरा किंचित मोठा केला जातो आणि डायलेटर व पील-अवे शीथ गाईडवायरवरून पेल्विसच्या दिशेने पुढे सरकवले जातात.","rationale":"ऊतींना हळूवारपणे पसरवून कॅथेटर सहज आत जाण्यासाठी एक तात्पुरता सुरक्षित मार्ग तयार करतो.","correlation":"मार्गदर्शक टप्पा 7 शी संबंधित · कॅथेटर गाईडच्या मार्गाने पुढे सरकते: मार्ग रुंद करून पातळ आवरण आत घातले जाते."},{"title":"पोटाच्या पोकळीत शीथ घट्ट बसवणे","sub":"अंतिम पेल्विक कोन आणि गाईडवायर काढणे","image":"assets/clinical/step-5-sheath-pelvic-seating.webp","alt":"45 अंश कोनात पोटाच्या भिंतीवर बसलेली पील-अवे शीथ","instruments":["पील-अवे शीथ","हब लॉकिंग कॉलर"],"action":"शीथ 45° कोनात पेल्विसमध्ये सरकवली जाते जोपर्यंत तिचा हब त्वचेवर बसत नाही. त्यानंतर डायलेटर आणि गाईडवायर काढून घेतले जातात.","rationale":"कॅथेटर घालण्यासाठी एक सुरक्षित प्लास्टिक नळी सोडताना सर्व तीक्ष्ण आणि कडक तारा बाहेर काढल्या जातात.","correlation":"मार्गदर्शक टप्पा 7 शी संबंधित: मऊ सिलिकॉन नळी घालण्यासाठी तात्पुरता प्लास्टिक मार्ग तयार."},{"title":"कॅथेटर घालणे आणि आतील कफ बसवणे","sub":"डॅक्रॉन कफसह सिलिकॉन नळी पुढे सरकवणे","image":"assets/clinical/step-6-catheter-cuff-feed.webp","alt":"पील-अवे शीथद्वारे घातलेले सिलिकॉन कॅथेटर ज्यावर पांढरा डॅक्रॉन कफ दिसत आहे","instruments":["सिलिकॉन टेनकॉफ कॅथेटर","डीप डॅक्रॉन कफ","पील-अवे शीथ टॅब्स"],"action":"सिलिकॉन कॅथेटर शीथद्वारे आत सरकवले जाते जोपर्यंत आतील डॅक्रॉन कफ पोटाच्या स्नायूच्या पातळीवर पोहोचत नाही.","rationale":"2 आठवड्यांत शरीराचे टिश्यू या कापडी कफमध्ये वाढतात, ज्यामुळे द्रव गळती आणि संसर्गाविरुद्ध वॉटरटाईट सील बनते.","correlation":"मार्गदर्शक टप्पा 7 शी संबंधित: आतील कफ पोटाच्या स्नायूमध्ये घट्ट बसवला जातो."},{"title":"स्टायलेटद्वारे पेल्विसमध्ये खोलवर स्थापना","sub":"वळवलेले टोक पेल्विसच्या खोल भागात पोहोचल्याची खात्री करणे","image":"assets/clinical/step-7       const [d,y]=rows[i], ty=46+d;
      const body=lines.map((s,j)=>`<tspan x="200" dy="${j?13:0}">${esc(s)}</tspan>`).join('');

  function cuffHealing(){
    const titles=t('cuffStages');
    return titles.map((title,i)=>{
      const x=18+i*172, dense=i;
      let p=`<g transform="translate(${x},22)">`;
      p+=`<clipPath id="cP${i}"><rect x="0" y="0" width="152" height="150" rx="9"/></clipPath>`;
      p+=`<g clip-path="url(#cP${i})"><rect x="0" y="0" width="152" height="150" fill="url(#gFat)"/><rect x="0" y="0" width="152" height="150" fill="url(#pFat)" opacity=".7"/><rect x="0" y="96" width="152" height="54" fill="url(#gMuscle)"/><rect x="0" y="96" width="152" height="54" fill="url(#pMuscle)"/>`;
      const fib=[0,4,9][dense];
      for(let f=0;f<fib;f++){const fy=52+f*4.6;p+=`<path d="M${52+ (f%3)*2},${fy} C68,${fy-3} 84,${fy+3} ${100-(f%3)*2},${fy}" fill="none" stroke="#d0a86f" stroke-width="1.5" opacity=".85"/>`;}
      p+=`<path d="M-6,74 H158" stroke="#fffdf8" stroke-width="17" stroke-linecap="round"/><path d="M-6,74 H158" stroke="url(#gTube)" stroke-width="12" stroke-linecap="round"/><path d="M-6,70 H158" stroke="#8fdccd" stroke-width="3" opacity=".5"/>`;
      p+=`<g transform="translate(76,74)"><rect x="-27" y="-13" width="54" height="26" rx="7" fill="url(#gCuff)" stroke="#9d9a8b" stroke-width="1.2"/><path d="M-19-13v26M-11-13v26M-3-13v26M5-13v26M13-13v26M21-13v26" stroke="#b0ac9c" stroke-width="1.2"/></g>`;
      if(dense) p+=`<g opacity="${dense===1?'.6':'.95'}" fill="none" stroke="#c99a63" stroke-width="1.6"><path d="M49,61 C58,66 58,82 49,87"/><path d="M103,61 C94,66 94,82 103,87"/></g>`;
      p+=`</g><rect x="0" y="0" width="152" height="150" rx="9" fill="none" stroke="#cfd8cb" stroke-width="1.3"/>`;
      p+=`<text x="76" y="-6" text-anchor="middle" class="cap" stroke="none">${esc(title)}</text></g>`;
      return p;
    }).join('');

  function exitSite(x,y,inflamed,labels){
    let g=`<g transform="translate(${x},${y})"><clipPath id="cE${inflamed?1:0}"><rect x="0" y="0" width="176" height="176" rx="12"/></clipPath><g clip-path="url(#cE${inflamed?1:0})">`;
    g+=`<rect x="0" y="0" width="176" height="176" fill="url(#gSkin)"/>`;
    g+=`<g stroke="#d7ab8d" stroke-width="1" opacity=".5" fill="none"><path d="M14,26 C50,18 70,40 96,30M20,150 C56,142 90,158 130,148M140,52 C154,72 148,96 158,116"/></g>`;
    if(inflamed) g+=`<circle cx="88" cy="74" r="62" fill="url(#gInflamed)"/><ellipse cx="88" cy="74" rx="30" ry="24" fill="#c2685c" opacity=".38"/>`;
    g+=`<ellipse cx="88" cy="74" rx="15" ry="11" fill="${inflamed?'#a9524a':'#dda98d'}" opacity=".9"/>`;
    if(inflamed) g+=`<g fill="#d9b25f" opacity=".95"><path d="M76,68 q7,-6 13,-1 q-6,7 -13,1Z"/><path d="M94,80 q8,-4 12,3 q-8,4 -12,-3Z"/></g><ellipse cx="88" cy="74" rx="24" ry="18" fill="none" stroke="#a9524a" stroke-width="1.6" opacity=".7"/>`;
    g+=`<path d="M88,40 V74" stroke="#2f8a7a" stroke-width="11" opacity=".22" stroke-linecap="round"/>`;
    g+=`<path d="M88,74 C88,116 86,146 82,182" stroke="#fffdf8" stroke-width="16" stroke-linecap="round"/><path d="M88,74 C88,116 86,146 82,182" stroke="url(#gTube)" stroke-width="11.5" stroke-linecap="round"/><path d="M88,74 C88,116 86,146 82,182" stroke="#8fdccd" stroke-width="3" opacity=".5" stroke-linecap="round"/>`;
    if(!inflamed) g+=`<g transform="translate(85,140) rotate(-4)"><rect x="-42" y="-15" width="84" height="30" rx="8" fill="#f7f1e4" stroke="#d9cfba" stroke-width="1.3" opacity=".96"/><path d="M-30,-15v30M-18,-15v30M18,-15v30M30,-15v30" stroke="#e4dbc7"/></g>`;
    g+=`</g><rect x="0" y="0" width="176" height="176" rx="12" fill="none" stroke="#cfd8cb" stroke-width="1.3"/>`;

  function effluent(x,y,cloudy,label){
    return `<g transform="translate(${x},${y})"><text x="60" y="72" text-anchor="middle" font-size="21" fill="#4d6157" stroke="none" opacity="${cloudy?'.14':'.9'}">PD</text><text x="60" y="96" text-anchor="middle" font-size="14" fill="#4d6157" stroke="none" opacity="${cloudy?'.08':'.75'}">1.5 L</text><rect x="16" y="-14" width="88" height="14" rx="4" fill="#e6ece7" stroke="#9fb2a6"/><path d="M60,-14 V-32" stroke="#bcd3dd" stroke-width="4"/><rect x="10" y="0" width="100" height="132" rx="12" fill="${cloudy?'url(#gCloud)':'url(#gFluid)'}" fill-opacity="${cloudy?'.97':'.72'}" stroke="${cloudy?'#b9b295':'#8fb6c8'}" stroke-width="1.6"/><path d="M22,12 C30,40 26,80 34,120" fill="none" stroke="#ffffff" stroke-width="5" opacity=".45"/><text x="60" y="152" text-anchor="middle" class="cap" stroke="none" fill="${cloudy?'#9e3a33':'#2c6b4f'}">${esc(label)}</text></g>`;
  }

  const SPRITE = `<svg width="0" height="0" focusable="false" aria-hidden="true" style="position:absolute">${DEFS}<defs>${ARROWDEF}</defs></svg>`;

    const L=t('markLabelLines'), anchors=[
      ['M262,124 C300,116 350,112 384,110',262,124,390,114,'start'],
      ['M277,190 C320,186 356,184 384,182',277,190,390,186,'start'],

  function numbLabels(){

  function flowLabels(){
    const L=t('flowLabels'), anchors=[[440,80,398,30,'end'],[61,346,26,300,'start'],[192,254,150,214,'end']];
    return anchors.map(([px,py,tx,ty,a],i)=>`${lead(`M${px},${py} L${tx+(a==='end'?6:-6)},${ty+6}`)}${dot(px,py)}${note(tx,ty,L[i],a)}`).join('');

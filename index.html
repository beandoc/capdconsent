  function livingLabels(){
    const L=t('livingLabels'), anchors=[[190,90,250,86],[150,196,250,150],[176,60,250,44]];
    return anchors.map(([px,py,tx,ty],i)=>`${lead(`M${px},${py} C${(px+tx)/2},${py} ${tx-14},${ty} ${tx-6},${ty-4}`)}${dot(px,py)}${note(tx,ty,L[i])}`).join('');
  }

  const FIG_NO={anatomy:1,prepare:2,comfort:3,placement:4,recovery:5,healing:6,living:7,warnings:8};
  const plate=(caption,viewBox,inner,label,single)=>`<div class="plate"><p class="plate-cap">${esc(caption)}</p><svg class="plate-svg${single?' plate-wide':''}" viewBox="${viewBox}" role="img" aria-label="${esc(label)}">${inner}</svg></div>`;
  function figure(visual,plates,subtitle){
    return `<figure class="figure"><div class="figure-head"><span class="figure-tag">${esc(t('figureTag',{n:FIG_NO[visual]}))}</span>${subtitle?`<span class="figure-scale">${esc(subtitle)}</span>`:''}</div>${SPRITE}<div class="plates${plates.length===1?' plate-single':''}">${plates.join('')}</div><figcaption class="figure-note">${icon('info')}${esc(t('figureScale'))}</figcaption></figure>`;
  }

  function renderVisual(){
    const p=phase(), alt=t('diagramAlts')[p.visual]; let html='';
    if(p.visual==='anatomy'){
      html=figure('anatomy',[
        plate(t('plateFront'),'0 0 524 400',torso({hot:state.hotspot})+frontLabels(),alt),
        plate(t('plateSection'),'0 0 340 400',wall({hot:state.hotspot})+wallLabels()+scaleMark()+cuffKeyPanel(),alt)
      ]);
      html+=`<div class="hotspots" role="group" aria-label="${esc(t('exploreLabel'))}">${t('hotspotLabels').map((s,i)=>`<button class="hotspot" data-hotspot="${i}" aria-pressed="${state.hotspot===i}">${esc(s)}</button>`).join('')}</div>`;
      const d=t('hotspotDetails')[state.hotspot];
      html+=`<p class="detail-note" role="status">${icon('info')}<span><strong>${esc(d[0])}</strong> ${esc(d[1])}</span></p>`;
    }else if(p.visual==='prepare'){
      html=figure('prepare',[plate(t('plateSite'),'0 0 524 400',torso({marking:true})+markLabels(),alt,true)]);
    }else if(p.visual==='comfort'){
      html=figure('comfort',[
        plate(t('plateDrape'),'0 0 524 400',torso({stage:1}),alt),
        plate(t('plateNumb'),'0 0 340 400',wall({numb:true})+numbLabels(),alt)
      ]);
    }else if(p.visual==='placement'){
      const s=state.sequence;
      html=figure('placement',[
        plate(t('plateFront'),'0 0 524 400',torso({stage:s}),alt),
        plate(t('plateSection'),'0 0 340 400',wall({stage:s})+wallLabels(),alt)
      ],t('drapeNote'));
      html+=`<p class="detail-note" role="status">${icon('info')}<span><strong>${esc(t('sequenceTitles')[s])}.</strong> ${esc(t('sequenceDetails')[s])}</span></p>`;
      html+=`<div class="seq"><div class="seq-rail" role="group" aria-label="${esc(t('sequenceLabel'))}">${t('sequenceTitles').map((title,i)=>`<button class="seq-dot ${i<s?'past':''}" data-sequence="${i}" aria-pressed="${s===i}" aria-label="${esc(t('sequenceStep',{n:i+1})+': '+title)}"><span>${i+1}</span></button>`).join('')}</div><div class="seq-bar play-left"><button class="outline-btn" id="play-sequence">${icon(state.playing?'pause':s===7?'replay':'play')}${esc(state.playing?t('pause'):s===7?t('replay'):t('play'))}</button><span class="seq-count">${esc(t('sequenceCount',{n:s+1}))}</span><button class="outline-btn" data-action="gallery-prompt">${icon('camera')}<span>${esc(t('clinicalPhotosBtn'))}</span></button><button class="outline-btn" data-action="consent-tool">${icon('shield')}<span>${esc(t('consentQuickBtn'))}</span></button></div></div>`;
    }else if(p.visual==='recovery'){
      html=figure('recovery',[
        plate(t('plateFlow'),'0 0 524 400',torso({flow:true,dressed:true})+flowLabels(),alt),
        plate(t('plateSection'),'0 0 340 400',wall({stage:7})+wallLabels(),alt)
      ]);
    }else if(p.visual==='healing'){
      html=figure('healing',[plate(t('plateCuff'),'0 0 532 194',cuffHealing(),alt,true)]);
      html+=`<div class="plate-notes">${t('cuffStages').map((s,i)=>`<div><strong>${esc(s)}</strong>${esc(t('cuffStageNotes')[i])}</div>`).join('')}</div>`;
    }else if(p.visual==='living'){
      html=figure('living',[plate(t('plateExit'),'0 0 470 252',exitSite(30,42,false,t('exitLabels')[0])+livingLabels(),alt,true)]);
    }else{
      html=figure('warnings',[
        plate(t('plateCompare'),'0 0 400 226',exitSite(20,34,false,t('exitLabels')[0])+exitSite(204,34,true,t('exitLabels')[1]),alt),
        plate(t('plateEffluent'),'0 0 290 196',effluent(24,26,false,t('effluentLabels')[0])+effluent(154,26,true,t('effluentLabels')[1]),alt)
      ]);
      html+=`<p class="detail-note">${icon('info')}<span>${esc(t('effluentNote'))}</span></p>`;
      html+=`<div class="warnings"><p class="urgent-call" style="margin:0 0 15px">${esc(t('warningIntro'))}</p><ul class="warning-list">${t('warningItems').map(s=>`<li>${icon('flag')}<span>${esc(s)}</span></li>`).join('')}</ul><div class="urgent-call">${esc(t('warningAction'))}<br><button class="outline-btn" data-action="team">${icon('phone')}${esc(t('callDetails'))}</button></div></div>`;
    }
    if(p.note)html+=`<p class="detail-note">${icon('heart')}<span><strong>${esc(p.note[0])}</strong> ${esc(p.note[1])}</span></p>`;
    if(p.visual==='placement')html+=`<p class="detail-note">${icon('heart')}<span><strong>${esc(t('awakeNote')[0])}</strong> ${esc(t('awakeNote')[1])}</span></p>`;
    if(p.points)html+=`<ul class="key-points">${p.points.map(k=>`<li>${icon('check')}<span>${esc(CLINIC_CONFIG[k])}</span></li>`).join('')}</ul>`;
    $('visual-content').innerHTML=html;
  }

  const state = {
    language:'en',
    index:0,
    completed:new Set(),
    answers:{},
    caregiver:false,
    scale:1,
    hotspot:0,
    sequence:0,
    playing:false,
    finished:false,
    galleryIndex:0,
    galleryConfirmed:false,
    consentStep:0,
    consentQuiz:{},
    consentPatient:{
      name:'',
      age:'',
      serviceNo:'',
      rank:'',
      unit:'',
      mrn:'',
      ward:'',
      diagnosis:'',
      clinician:'',
      date:new Date().toISOString().split('T')[0]
    },
    consentDeclarations:[true,true,true,true,true,true]
  };
  const SEQ_LAST = 7, SEQ_MS = 5200;
  let audioToken=0, sequenceTimer, toastTimer;
  const t = (key,vars={}) => {let value=TRANSLATIONS[state.language][key];return typeof value==='string'?value.replace(/\{(\w+)\}/g,(_,k)=>vars[k]??`{${k}}`):value;};
  const phase = () => t('phases')[state.index];
  function hydrate(root=document){root.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));root.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));}
  function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,6500);}
  function renderJourney(){
    $('journey-steps').innerHTML=t('phases').map((p,i)=>`<li><button class="step ${i===state.index?'active':''} ${state.completed.has(i)?'done':''}" data-step="${i}" ${i===state.index?'aria-current="step"':''} aria-label="${i+1}. ${esc(p.name)}. ${esc(state.completed.has(i)?t('completed'):t('notCompleted'))}"><span class="step-number">${state.completed.has(i)?icon('check'):String(i+1).padStart(2,'0')}</span><span class="step-name">${esc(p.name)}<span class="step-sub">${esc(i===state.index?t('current'):p.sub)}</span></span></button></li>`).join('');
    const n=state.completed.size;$('progress-label').textContent=t('progress',{n});$('progress-percent').textContent=Math.round(n/8*100)+'%';$('progress-fill').style.width=(n/8*100)+'%';document.querySelector('.progress').setAttribute('aria-valuenow',n);
  }
  function renderRight(){
    const p=phase();$('right-panel').innerHTML=`<h2 class="section-heading">${esc(t('expect'))}</h2>${p.statuses.map(([i,h,b])=>`<section class="status-card"><div class="status-icon">${icon(i)}</div><h3>${esc(h)}</h3><p>${esc(b)}</p></section>`).join('')}<div class="reassurance">${icon('heart')}<span>${esc(t('reassurance'))}</span></div>${state.caregiver?`<section class="caregiver-card"><h3>${icon('people')}${esc(t('caregiverLabel'))}</h3><p>${esc(p.caregiver)}</p><button class="outline-btn" data-action="caregiver">${esc(t('caregiverOpen'))}</button></section>`:''}<button class="urgent-link" data-step="7">${icon('flag')}${esc(t('urgentLink'))}</button>`;
  }
  function renderQuiz(){
    const p=phase(),selected=state.answers[state.index];$('quiz-question').textContent=p.question;
    $('answers').innerHTML=p.answers.map((a,i)=>`<button class="answer ${selected===i?'selected':''} ${selected===i&&i!==p.correct?'retry':''}" data-answer="${i}" aria-pressed="${selected===i}"><span class="radio-dot" aria-hidden="true"></span>${esc(a)}</button>`).join('');
    $('feedback').textContent=selected===undefined?'':selected===p.correct?p.yes:p.no;$('feedback').className='feedback '+(selected!==undefined&&selected!==p.correct?'retry-text':'');
  }
  function render(){
    hydrate();renderJourney();const p=phase();
    $('chapter').innerHTML=icon('leaf')+esc(t('chapter',{n:state.index+1,category:p.category.toUpperCase()}));
    $('phase-title').textContent=p.title;$('phase-description').textContent=p.description;
    renderVisual();renderQuiz();renderRight();updateListen(false);
    $('back').disabled=state.index===0;$('next').innerHTML=esc(t(state.finished&&state.index===7?'review':state.index===7?'finish':'next'))+icon('right');
    $('completion').hidden=!state.finished;
    if(state.finished){
      const all=state.completed.size===8;
      $('completion').innerHTML=icon('sprout')+`<h2>${esc(t(all?'completionTitle':'incompleteTitle'))}</h2><p>${esc(t(all?'completionBody':'incompleteBody'))}</p><div style="margin-top:18px;padding:15px 18px;background:#eef6f2;border:1px solid #c8dece;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap"><div><strong style="display:block;font-size:.88rem;color:var(--deep)">${esc(t('consentTitle'))}</strong><span style="font-size:.78rem;color:var(--muted)">Review procedural disclosure, answer comprehension questions, and download a verified record.</span></div><button class="primary" data-action="consent-tool">${icon('shield')}${esc(t('consentCtaBtn'))}</button></div>`;
    }
  }
  function stopSequence(){clearInterval(sequenceTimer);state.playing=false;}
  function go(index){if(index<0||index>7)return;stopAudio();stopSequence();state.index=index;state.hotspot=0;state.sequence=0;state.finished=false;render();$('phase-title').focus({preventScroll:true});if(matchMedia('(max-width:760px)').matches)$('phase-title').scrollIntoView({behavior:'instant',block:'start'});}
  function next(){if(state.finished){go(0);return;}state.completed.add(state.index);if(state.index<7)go(state.index+1);else{stopAudio();state.finished=true;render();$('completion').focus();}}
  function updateListen(active){$('listen').innerHTML=icon(active?'stop':'volume')+esc(t(active?'stop':'listen'));$('listen').setAttribute('aria-pressed',String(active));}
  function stopAudio(){audioToken++;if('speechSynthesis' in window)window.speechSynthesis.cancel();updateListen(false);}
  function speak(){
    if($('listen').getAttribute('aria-pressed')==='true'){stopAudio();return;}
    if(!('speechSynthesis' in window)){toast(t('audioUnavailable'));return;}
    const voices=window.speechSynthesis.getVoices().filter(v=>v.localService&&v.lang.toLowerCase().startsWith(state.language));
    if(!voices.length){toast(t('audioOffline'));return;}
    const p=phase(),token=++audioToken;
    const parts=[p.title,p.description,...(p.points||[]).map(k=>tClinic(k)),...(p.note||[])];
    if(p.visual==='anatomy')parts.push(...t('hotspotDetails').flat(),...t('layerNames'),...t('cuffKey'));
    if(p.visual==='prepare')parts.push(...t('markLabels'));
    if(p.visual==='comfort')parts.push(...t('numbLabels'));
    if(p.visual==='placement')parts.push(...t('awakeNote'),...t('sequenceTitles').map((s,i)=>s+'. '+t('sequenceDetails')[i]));
    if(p.visual==='recovery')parts.push(...t('flowLabels'));
    if(p.visual==='healing')parts.push(...t('cuffStages').map((s,i)=>s+'. '+t('cuffStageNotes')[i]));
    if(p.visual==='living')parts.push(...t('livingLabels'));
    if(p.visual==='warnings')parts.push(t('effluentNote'),t('warningIntro'),...t('warningItems'),t('warningAction'));
    parts.push(...p.statuses.map(s=>s[1]+'. '+s[2]));if(state.caregiver)parts.push(t('caregiverLabel'),p.caregiver);parts.push(p.question,...p.answers,t('reminderBody'));
    const u=new SpeechSynthesisUtterance(parts.join('. '));u.voice=voices[0];u.lang=voices[0].lang;u.rate=.87;
    u.onend=()=>{if(token===audioToken)updateListen(false);};
    u.onerror=e=>{if(token===audioToken){updateListen(false);if(e.error!=='canceled'&&e.error!=='interrupted')toast(t('audioError'));}};
    updateListen(true);window.speechSynthesis.speak(u);
  }

  function downloadConsentRecord(){
    if(state.language!=='en'){window.print();return;}
    const latin=s=>String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/[^\x20-\x7e]/g,'?');
    const wrap=(value,limit)=>{const words=latin(value).split(/\s+/),lines=[];let line='';for(const word of words){if((line+' '+word).trim().length>limit&&line){lines.push(line);line=word;}else line=(line+' '+word).trim();}if(line)lines.push(line);return lines;};
    const pdfEscape=s=>latin(s).replace(/([\\()])/g,'\\$1');
    let stream='', y=795;
    const line=(s,size,bold=false,color='0.11 0.20 0.18')=>{stream+=`BT /${bold?'F2':'F1'} ${size} Tf ${color} rg 1 0 0 1 45 ${y.toFixed(1)} Tm (${pdfEscape(s)}) Tj ET\n`;};

    line('COMMAND HOSPITAL (SOUTHERN COMMAND) PUNE - DEPARTMENT OF NEPHROLOGY', 10.5, true, '0.11 0.42 0.37'); y-=16;
    line('CAPD CATHETER INSERTION - INFORMED CONSENT & SHARED DECISION RECORD', 9, true, '0.30 0.40 0.35'); y-=20;

    const pt=state.consentPatient;
    const ptName = pt.name || 'Not specified (Sign on paper)';
    const ptAge = pt.age || 'N/A';
    const ptSvc = pt.serviceNo ? `Service No: ${pt.serviceNo}` : '';
    const ptRank = pt.rank ? `Rank: ${pt.rank}` : '';
    const ptUnit = pt.unit ? `Unit: ${pt.unit}` : '';
    const ptMrn = pt.mrn || 'N/A';
    const ptWard = pt.ward ? `Ward/Bed: ${pt.ward}` : '';
    const ptDiag = pt.diagnosis ? `Diagnosis: ${pt.diagnosis}` : '';
    const ptDoc = pt.clinician || CLINIC_CONFIG.reviewedBy || 'Attending Nephrologist';
    const ptDate = pt.date || new Date().toISOString().split('T')[0];

    line(`Patient: ${ptName}   Age/Sex: ${ptAge}   MRN/HID: ${ptMrn}   ${ptSvc} ${ptRank}`.trim(), 8, true); y-=12;
    line(`Clinician: ${ptDoc}   Date: ${ptDate}   ${ptWard}   ${ptDiag}`.trim(), 7.5, false); y-=15;

    stream += `0.5 w 0.7 0.8 0.75 RG 45 ${y.toFixed(1)} m 550 ${y.toFixed(1)} l S\n`; y-=14;

    line('1. VERIFIED CLINICAL DISCLOSURE MODULES COMPLETED', 8.5, true, '0.15 0.35 0.28'); y-=12;
    const modules = [
      '[X] Module 1 - Overview: Indications for permanent peritoneal dialysis access and catheter geometry.',
      '[X] Module 2 - Surgical Technique: Percutaneous Seldinger route with explicit Open Mini-Laparotomy contingency.',
      '[X] Module 3 - Benefits & Alternatives: Continuous gentle filtration vs Hemodialysis, Transplant, Conservative care.',
      '[X] Module 4 - Four-Tier Risk Stratification: Immediate surgical, delayed infectious, mechanical & anesthetic risks.',
      `[X] Module 5 - Comprehension Quiz: Verified patient grasp (${Object.keys(state.consentQuiz).length}/4 answered correctly).`
    ];
    for(const m of modules){ line(m, 7.2); y-=10.5; }
    y-=3;

    stream += `0.5 w 0.7 0.8 0.75 RG 45 ${y.toFixed(1)} m 550 ${y.toFixed(1)} l S\n`; y-=14;

    line('2. PATIENT STATUTORY INFORMED CONSENT DECLARATIONS', 8.5, true, '0.15 0.35 0.28'); y-=12;
    const decls = CONSENT_SECTIONS[5].declarations;
    decls.forEach((d, idx)=>{
      const isChecked = state.consentDeclarations[idx] !== false;
      const prefix = isChecked ? '[X] ' : '[ ] ';
      const rows = wrap(prefix + d, 94);
      for(let r=0; r<rows.length; r++){
        line(rows[r], 7.2, r===0 && isChecked);
        y-=10;
      }
      y-=2;
    });
    y-=3;

    stream += `0.5 w 0.7 0.8 0.75 RG 45 ${y.toFixed(1)} m 550 ${y.toFixed(1)} l S\n`; y-=14;

    line('3. FOUR-PARTY PHYSICAL SIGNATURE VERIFICATION', 8.5, true, '0.15 0.35 0.28'); y-=24;

    line('___________________________________           ___________________________________           ___________________________________', 7.5, false, '0.4 0.4 0.4'); y-=11;
    line('Patient / Representative Signature            Attending Nephrologist Signature              Witness / PD Nurse Signature', 7.5, true); y-=10;
    line(`Name: ${ptName.slice(0,25)}                  Doctor: ${ptDoc.slice(0,25)}                  Date: ${ptDate}`, 7, false, '0.3 0.3 0.3'); y-=18;

    line('Institutional Statutory Notice: Executed pursuant to Armed Forces Medical Services & Command Hospital Pune SOPs.', 6.5, false, '0.4 0.4 0.4'); y-=9;
    line('Formal statutory legal consent is executed concurrently on Command Hospital Form No. Med/Consent/CAPD-01.', 6.5, false, '0.4 0.4 0.4'); y-=9;
    line('Generated locally by PD Consent Buddy · Shared Decision Companion · Zero PHI stored or transmitted.', 6.5, false, '0.5 0.5 0.5');

    const objects=[
      '<< /Type /Catalog /Pages 2 0 R >>',
      '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>',
      `<< /Length ${stream.length} >>\nstream\n${stream}endstream`
    ];
    let pdf='%PDF-1.4\n',offsets=[0];
    objects.forEach((obj,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;});
    const xref=pdf.length;
    pdf+=`xref\n0 7\n0000000000 65535 f \n${offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size 7 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;

    const url=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));
    const a=document.createElement('a');
    a.href=url;
    a.download='Command-Hospital-CAPD-Catheter-Consent.pdf';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast(t('consentRecordDownloaded'));
  }

    stopAudio();const wasPlaying=state.playing;stopSequence();if(wasPlaying)renderVisual();let title,body,buttons;
    if(kind==='consent-tool'){renderConsentCompanion(state.consentStep||0);return;}
    if(['summary','checklist','caregiver'].includes(kind)){title=t(kind==='summary'?'summaryTitle':kind==='checklist'?'checklistTitle':'caregiverTitle');body=handoutBody(kind);buttons=`<button class="outline-btn" data-action="print">${icon('printer')}${esc(t('print'))}</button>${kind==='summary'?`<button class="primary" data-action="download">${icon('download')}${esc(t('download'))}</button>`:''}`;}
    else if(kind==='gallery-prompt'){
      if(state.galleryConfirmed){renderClinicalGallery(state.galleryIndex||0);return;}
      title=t('gallerySensitiveTitle');
      body=`<p class="note-box" style="margin-top:0">${esc(t('gallerySensitiveIntro'))}</p><p>${esc(t('gallerySensitiveAudience'))}</p><p class="detail-note" style="margin:14px 0;border-left:3px solid var(--teal);padding-left:12px">${icon('info')}<span>${esc(t('gallerySensitiveWarning'))}</span></p>`;
      buttons=`<button class="outline-btn" data-action="close">${esc(t('keepIllustrated'))}</button><button class="primary" data-action="confirm-gallery">${icon('camera')}${esc(t('viewPhotos'))}</button>`;
    }
    else if(kind==='team'){title=t('teamTitle');body=`<p>${esc(t('teamIntro'))}</p>${phoneBlock()}<h3>${esc(t('questionsTitle'))}</h3><ul>${t('teamQuestions').map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p class="note-box">${esc(t('noteEmergency'))}</p>`;buttons=`<button class="primary" data-action="close">${esc(t('close'))}</button>`;}
    else if(kind==='reset'){title=t('resetTitle');body=`<p>${esc(t('resetBody'))}</p>`;buttons=`<button class="outline-btn" data-action="close">${esc(t('cancel'))}</button><button class="primary" data-action="confirm-reset">${esc(t('resetConfirm'))}</button>`;}
    else{title=t('sourcesTitle');body=`<p>${esc(t('sourcesIntro'))}</p><p class="note-box">${esc(CLINIC_CONFIG.reviewedBy&&CLINIC_CONFIG.reviewDate?t('reviewed',{name:CLINIC_CONFIG.reviewedBy,date:CLINIC_CONFIG.reviewDate}):t('reviewPending'))}</p><h3>${esc(t('sourcesHeading'))}</h3><ul>${t('sourceNames').map((s,i)=>`<li><a href="${SOURCE_URLS[i]}" target="_blank" rel="noopener noreferrer">${esc(s)}</a></li>`).join('')}</ul><p>${esc(t('sourcesNote'))}</p><h3>${esc(t('illustrationTitle'))}</h3><p>${esc(t('illustrationBody'))}</p><h3>${esc(t('privacyTitle'))}</h3><p>${esc(t('privacyBody'))}</p>`;buttons=`<button class="primary" data-action="close">${esc(t('close'))}</button>`;}
    $('modal-title').textContent=title;$('modal-body').innerHTML=body;$('modal-footer').innerHTML=buttons;$('close-modal').innerHTML=icon('close');$('modal').showModal();$('modal').scrollTop=0;
  }

  document.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target)return;
    if(target.dataset.step!==undefined){go(Number(target.dataset.step));return;}
    if(target.dataset.answer!==undefined){state.answers[state.index]=Number(target.dataset.answer);renderQuiz();document.querySelector(`[data-answer="${target.dataset.answer}"]`).focus();return;}
    if(target.dataset.hotspot!==undefined){state.hotspot=Number(target.dataset.hotspot);renderVisual();document.querySelector(`[data-hotspot="${state.hotspot}"]`).focus();return;}
    if(target.dataset.sequence!==undefined){setSequence(Number(target.dataset.sequence));return;}
    if(target.id==='play-sequence'){toggleSequence();return;}
    if(target.id==='gallery-prev'){if(state.galleryIndex>0)renderClinicalGallery(state.galleryIndex-1);return;}
    if(target.id==='gallery-next'){if(state.galleryIndex<CLINICAL_STEPS.length-1)renderClinicalGallery(state.galleryIndex+1);return;}
    if(target.dataset.galleryStep!==undefined){renderClinicalGallery(Number(target.dataset.galleryStep));return;}
    if(target.dataset.consentStep!==undefined){state.consentStep=Number(target.dataset.consentStep);renderConsentCompanion(state.consentStep);return;}
    if(target.hasAttribute('data-consent-next')||target.closest('[data-consent-next]')){
      if(state.consentStep<CONSENT_SECTIONS.length-1){
        state.consentStep++;
        renderConsentCompanion(state.consentStep);
      }
      return;
    }
    if(target.hasAttribute('data-consent-review')||target.closest('[data-consent-review]')){$('modal').scrollTop=0;toast('Reviewing current section');return;}
    if(target.dataset.consentQuizQ!==undefined){
      const q=Number(target.dataset.consentQuizQ),opt=Number(target.dataset.consentQuizOpt);
      state.consentQuiz[q]=opt;
      renderConsentCompanion(state.consentStep);
      return;
    }
    const action=target.dataset.action;if(!action)return;
    if(action==='close')closeModal();
    else if(action==='print')window.print();
    else if(action==='download')downloadSummary();
    else if(action==='download-consent')downloadConsentRecord();
    else if(action==='consent-tool')openModal('consent-tool');
    else if(action==='confirm-reset'){state.completed.clear();state.answers={};closeModal();go(0);}
    else if(action==='confirm-gallery'){state.galleryConfirmed=true;renderClinicalGallery(state.galleryIndex||0);}
    else openModal(action);
  });

  document.addEventListener('change',event=>{
    const decl=event.target.dataset.consentDecl;
    if(decl!==undefined){state.consentDeclarations[Number(decl)]=event.target.checked;return;}
  });
  document.addEventListener('input',event=>{
    if(event.target.id==='consent-input-name')state.consentPatient.name=event.target.value;
    if(event.target.id==='consent-input-age')state.consentPatient.age=event.target.value;
    if(event.target.id==='consent-input-serviceno')state.consentPatient.serviceNo=event.target.value;
    if(event.target.id==='consent-input-rank')state.consentPatient.rank=event.target.value;
    if(event.target.id==='consent-input-unit')state.consentPatient.unit=event.target.value;
    if(event.target.id==='consent-input-mrn')state.consentPatient.mrn=event.target.value;
    if(event.target.id==='consent-input-ward')state.consentPatient.ward=event.target.value;
    if(event.target.id==='consent-input-diag')state.consentPatient.diagnosis=event.target.value;
    if(event.target.id==='consent-input-clinician')state.consentPatient.clinician=event.target.value;
    if(event.target.id==='consent-input-date')state.consentPatient.date=event.target.value;
  });

  $('back').addEventListener('click',()=>go(state.index-1));$('next').addEventListener('click',next);$('listen').addEventListener('click',speak);
  $('font-down').addEventListener('click',()=>resizeText(-.125));$('font-up').addEventListener('click',()=>resizeText(.125));$('font-down').disabled=true;
  $('caregiver-toggle').addEventListener('change',e=>{state.caregiver=e.target.checked;stopAudio();renderRight();});
  $('language').addEventListener('change',e=>{const lang=e.target.value;if(!TRANSLATIONS[lang]){e.target.value=state.language;toast(t('languageUnavailable'));return;}stopAudio();state.language=lang;document.documentElement.lang=lang;render();});
  $('close-modal').addEventListener('click',closeModal);
  $('modal').addEventListener('close',()=>$('modal').classList.remove('gallery-modal','consent-modal'));
  $('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
  document.addEventListener('keydown',e=>{
    if($('modal').open && $('modal').classList.contains('gallery-modal')){
      if(e.key==='ArrowLeft'&&state.galleryIndex>0)renderClinicalGallery(state.galleryIndex-1);
      else if(e.key==='ArrowRight'&&state.galleryIndex<CLINICAL_STEPS.length-1)renderClinicalGallery(state.galleryIndex+1);
    }
  });
  window.addEventListener('pagehide',()=>{stopAudio();stopSequence();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAudio();if(state.playing){stopSequence();renderVisual();}}});
  if('speechSynthesis' in window)window.speechSynthesis.getVoices();
  render();
  </script>\n</body>\n</html>\n
